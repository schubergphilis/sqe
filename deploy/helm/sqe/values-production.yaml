# Production overlay for the SQE Helm chart (ISSUE-404).
#
# Default values.yaml is the easy dev path (production_mode=false, ephemeral
# audit, ServiceMonitor off). Overlay this file for a production install:
#
#   helm install sqe deploy/helm/sqe/ \
#     -f deploy/helm/sqe/values-production.yaml
#
# This file contains NO credentials. You MUST supply existing Secrets,
# TLS/ingress, and (when workers are on) workerSecret before install.
# The chart fail-closes at template time if production_mode and
# worker.enabled are both true with an empty workerSecret.

# ── Engine production validator ─────────────────────────────
# Enforces no anonymous/bearer_passthrough, rate_limit.enabled=true,
# allow_insecure_transport=false, non-empty worker_secret when distributed.
coordinator:
  production_mode: true

# ── Rate limiting (required by production_mode) ─────────────
config:
  rate_limit:
    enabled: true
  # FileIO must not fall back to the shared [storage] S3 keys after
  # LOAD_TABLE. production_mode refuses to start if this is false on a
  # REST catalog (issue #395).
  catalog:
    require_vended_credentials: true
  # production_mode refuses caller-supplied object-store keys on the file
  # table functions (#751).
  storage:
    tvf:
      allow_inline_credentials: false
  # production_mode refuses the default policy engine (passthrough enforces
  # no row filters, masks or column restrictions) and the default grant
  # backend (none) unless the matching security.allow_* flag acknowledges
  # the choice (architecture review 212). Pick the real engines for your
  # platform; the values below are the Ranger pairing from the
  # polaris-ranger-keycloak quickstart.
  policy:
    engine: ranger
    ranger:
      # Required: the engine refuses to start with engine=ranger and an
      # empty url. The Ranger admin password arrives as the
      # SQE_POLICY__RANGER__ADMIN_PASSWORD env override, never in values.
      url: ""
      service_name: "sqe"
      project_tags: true
  access_control:
    # Rendered as access_control.url = policy.ranger.url (the field the grant
    # backend reads, #732); templating fails while that url is empty. Password:
    # SQE_ACCESS_CONTROL__RANGER__ADMIN_PASSWORD env override.
    backend: ranger
  # To run WITHOUT a policy engine or grant backend on purpose, say so
  # explicitly instead; production_mode then starts and logs the disabled
  # enforcement at warn level:
  # security:
  #   allow_no_policy_engine: true
  #   allow_no_grant_backend: true

# ── Durable audit log ───────────────────────────────────────
# Mounts a ReadWriteOnce PVC at audit.path so records survive reschedule.
# Point existingClaim at a PVC you manage, or let the chart create one
# (audit.persistence.size, default 1Gi).
audit:
  persistence:
    enabled: true

# ── Prometheus Operator scrape ──────────────────────────────
serviceMonitor:
  enabled: true

# ── Network segmentation ────────────────────────────────────
# Default-deny ingress on coordinator and workers: only the SQL, metrics and
# (when on) MCP ports reach the coordinator, and workers take traffic from the
# coordinator only. Narrow `from` to your ingress controller and Prometheus.
# Fill `egress` with your catalog, identity provider, object store, policy
# service and OTLP collector to turn on default-deny egress as well; DNS and
# the coordinator<->worker hops are added by the chart. See values.yaml.
networkPolicy:
  enabled: true
  from: []
    # - namespaceSelector:
    #     matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
    # - namespaceSelector:
    #     matchLabels: { kubernetes.io/metadata.name: monitoring }
  egress: []

# ── Required: existing Secrets (do not put credentials here) ─
# Create these out of band (sealed-secrets, external-secrets, etc.) and
# point the chart at them. Inline `secrets:` / workerSecret.value end up
# in `helm get values` and are not acceptable in production.
#
#   existingSecret: "sqe-credentials"
#     keys: SQE_AUTH__CLIENT_SECRET, SQE_STORAGE__S3_ACCESS_KEY,
#           SQE_STORAGE__S3_SECRET_KEY
#
# When worker.enabled=true you MUST also set:
#   workerSecret:
#     existingSecret: "sqe-worker-secret"
#     key: "SQE_WORKER_SECRET"
# Templating fails if production_mode=true, worker.enabled=true, and
# neither workerSecret.existingSecret nor workerSecret.value is set.
existingSecret: ""

# ── Required: TLS / ingress ─────────────────────────────────
# production_mode rejects allow_insecure_transport. Terminate TLS at the
# ingress for Trino HTTP / web UI / Quack, and use [coordinator.tls]
# (or a gRPC-aware ingress) for Flight SQL. Example:
#
# ingress:
#   enabled: true
#   className: nginx
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod
#   hosts:
#     - host: sqe.example.com
#       paths:
#         - path: /
#           pathType: Prefix
#           portName: trino-http
#   tls:
#     - secretName: sqe-tls
#       hosts:
#         - sqe.example.com
#
# Pin the image by digest for a reproducible install:
#   image:
#     tag: "0.37.0@sha256:<digest>"
#     pullPolicy: IfNotPresent
