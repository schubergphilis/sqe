{{- if .Values.ingress.enabled -}}
{{- /*
SEC-06: the coordinator's HTTP listeners (Trino HTTP, web UI, Quack) serve
plaintext by design. Terminate TLS here at the ingress and keep
security.allow_insecure_transport = false in the engine config. Flight SQL is
gRPC: use [coordinator.tls] native TLS or a gRPC-aware ingress for that port,
not this HTTP Ingress.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sqe.fullname" . }}
  labels:
    {{- include "sqe.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "sqe.fullname" $ }}-coordinator
                port:
                  name: {{ .portName | default "trino-http" }}
          {{- end }}
    {{- end }}
{{- end }}
