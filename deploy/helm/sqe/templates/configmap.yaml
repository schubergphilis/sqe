{{- /* ISSUE-404: fail closed when production_mode + workers have no secret. */ -}}
{{- if and .Values.coordinator.production_mode .Values.worker.enabled (not (include "sqe.workerSecretConfigured" .)) }}
{{- fail "coordinator.production_mode=true and worker.enabled=true require workerSecret.existingSecret or workerSecret.value (see values-production.yaml)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sqe.fullname" . }}-config
  labels:
    {{- include "sqe.labels" . | nindent 4 }}
data:
  sqe.toml: |
    [coordinator]
    flight_sql_port = {{ .Values.config.coordinator.flight_sql_port }}
    trino_http_port = {{ .Values.config.coordinator.trino_http_port }}
    mode = {{ .Values.config.coordinator.mode | quote }}
    production_mode = {{ .Values.coordinator.production_mode }}
    # DEP-02: the engine's tracked memory_limit defaults to 8GB in code, but
    # the coordinator pod is capped at 2Gi by default -- DataFusion would
    # allocate toward 8GB and the kernel OOMKills the pod long before spill
    # fires. Render a coordinator memory_limit sized below the pod limit
    # (~70-75%) so spill triggers before the cgroup OOM. DEP-01 gives /tmp the
    # writable volume the spill needs.
    memory_limit = {{ .Values.config.coordinator.memory_limit | quote }}
    spill_to_disk = {{ .Values.config.coordinator.spill_to_disk }}
    spill_dir = {{ .Values.config.coordinator.spill_dir | quote }}
    {{- if .Values.worker.enabled }}
    worker_urls = [{{ range $i, $e := until (int .Values.worker.replicas) }}{{ if $i }}, {{ end }}"http://{{ include "sqe.fullname" $ }}-worker-{{ $e }}.{{ include "sqe.fullname" $ }}-worker-headless:50052"{{ end }}]
    {{- end }}

    [worker]
    {{- if .Values.worker.enabled }}
    # ISSUE-218: only render coordinator_url in distributed mode. The engine's
    # config validation rejects a non-empty coordinator_url with an empty
    # worker_secret, so emitting this in single-node mode would crash a plain
    # `helm install` that never set a secret. In distributed mode the secret
    # arrives as the SQE_WORKER__WORKER_SECRET env override.
    coordinator_url = "http://{{ include "sqe.fullname" . }}-coordinator:50051"
    {{- end }}
    heartbeat_interval_secs = {{ .Values.config.worker.heartbeat_interval_secs }}
    # DEP-02: worker engine memory_limit must sit below the worker pod limit
    # (~75%) to leave headroom for Arrow buffers outside DataFusion's accounted
    # pool; an 8GB engine limit in an 8Gi pod leaves zero headroom and OOMKills.
    memory_limit = {{ .Values.config.worker.memory_limit | quote }}
    spill_dir = {{ .Values.config.worker.spill_dir | quote }}

    [auth]
    keycloak_url = {{ .Values.config.auth.keycloak_url | quote }}
    realm = {{ .Values.config.auth.realm | quote }}
    client_id = {{ .Values.config.auth.client_id | quote }}
    token_refresh_buffer_secs = {{ .Values.config.auth.token_refresh_buffer_secs }}
    ssl_verification = {{ .Values.config.auth.ssl_verification }}

    [catalog]
    catalog_url = {{ .Values.config.catalog.catalog_url | quote }}
    warehouse = {{ .Values.config.catalog.warehouse | quote }}
    metadata_cache_ttl_secs = {{ .Values.config.catalog.metadata_cache_ttl_secs }}
    require_vended_credentials = {{ .Values.config.catalog.require_vended_credentials }}

    [storage]
    s3_endpoint = {{ .Values.config.storage.s3_endpoint | quote }}
    s3_region = {{ .Values.config.storage.s3_region | quote }}
    s3_path_style = {{ .Values.config.storage.s3_path_style }}

    [policy]
    engine = {{ .Values.config.policy.engine | quote }}
    {{- if eq .Values.config.policy.engine "ranger" }}
    # policy.ranger.admin-password arrives as the SQE_POLICY__RANGER__ADMIN_PASSWORD
    # env override, never through this ConfigMap.

    [policy.ranger]
    url = {{ .Values.config.policy.ranger.url | quote }}
    service-name = {{ .Values.config.policy.ranger.service_name | quote }}
    project-tags = {{ .Values.config.policy.ranger.project_tags }}
    {{- end }}

    [access_control]
    backend = {{ .Values.config.access_control.backend | quote }}
    {{- if eq .Values.config.access_control.backend "ranger" }}
    # Grants go to the same Ranger Admin the policy engine reads from.

    [access_control.ranger]
    url = {{ .Values.config.policy.ranger.url | quote }}
    service-name = {{ .Values.config.policy.ranger.service_name | quote }}
    {{- end }}

    # Architecture review 212: production_mode refuses policy.engine =
    # passthrough and access_control.backend = none unless acknowledged here.
    [security]
    allow_no_policy_engine = {{ .Values.config.security.allow_no_policy_engine }}
    allow_no_grant_backend = {{ .Values.config.security.allow_no_grant_backend }}

    [rate_limit]
    enabled = {{ .Values.config.rate_limit.enabled }}
    per_user_queries_per_minute = {{ .Values.config.rate_limit.per_user_queries_per_minute }}
    global_queries_per_minute = {{ .Values.config.rate_limit.global_queries_per_minute }}

    [metrics]
    prometheus_port = {{ .Values.config.metrics.prometheus_port }}
    otlp_endpoint = {{ .Values.config.metrics.otlp_endpoint | quote }}
    traces_otlp_endpoint = {{ .Values.config.metrics.traces_otlp_endpoint | quote }}
    # ISSUE-248: derive audit_log_path from the audit.* block so the toml and
    # the mounted volume agree by construction. Empty when audit.enabled=false
    # (the logger becomes a no-op); otherwise a file under the mounted audit dir.
    {{- if .Values.audit.enabled }}
    audit_log_path = {{ printf "%s/%s" (trimSuffix "/" .Values.audit.path) .Values.audit.fileName | quote }}
    {{- else }}
    audit_log_path = ""
    {{- end }}
