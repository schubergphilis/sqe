{{- if .Values.worker.enabled }}
# Headless service so Prometheus (and the ServiceMonitor below) can scrape
# every worker pod. The coordinator Service is the only other Service in
# this chart; without this one, worker alerts have no series (#418).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sqe.fullname" . }}-worker
  labels:
    {{- include "sqe.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  selector:
    {{- include "sqe.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: {{ .Values.config.metrics.prometheus_port }}
      targetPort: metrics
    - name: flight
      port: 50052
      targetPort: flight
{{- end }}
