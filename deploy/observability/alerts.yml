# Prometheus rules for SQE. Load with Prometheus `rule_files` or as a
# PrometheusRule CRD (kube-prometheus / prometheus-operator).
#
# Metric names match crates/sqe-metrics. Thresholds are starting points;
# tune after a week of production traffic.
#
# GitLab #418. Helm ServiceMonitor is separate (deploy/helm/sqe); this file
# is the alert payload so a chart bump is not required to start paging.

groups:
  - name: sqe.queries
    rules:
      - alert: SqeQueryErrorRate
        expr: |
          sum(rate(sqe_query_count_total{status="error"}[5m]))
            /
          clamp_min(sum(rate(sqe_query_count_total[5m])), 1e-9)
            > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SQE query error rate is above 5%
          description: >
            More than 5% of queries are failing for 10m. Check coordinator
            logs, catalog reachability, and policy breaker state.

      - alert: SqeQueryErrorsSustained
        expr: sum(increase(sqe_query_count_total{status="error"}[15m])) > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: SQE recorded more than 20 query errors in 15m
          description: Burst of query failures. Correlate with error_code on sqe_query_count_total.

  - name: sqe.memory
    rules:
      - alert: SqeCoordinatorMemoryRed
        expr: sqe_coordinator_memory_pressure >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SQE coordinator memory pool is in the red band
          description: >
            Admission is rejecting new queries. Check spill, concurrent
            sorts, and coordinator.memory_limit vs the pod limit.

      - alert: SqeCoordinatorMemoryHigh
        # limit=0 is the unlimited-pool sentinel from spawn_metrics_reporter.
        # clamp_min(0, 1) would make any reserved byte look like 90%+ used.
        expr: |
          sqe_coordinator_memory_limit_bytes > 0
            and
          sqe_coordinator_memory_used_bytes
            /
          sqe_coordinator_memory_limit_bytes
            > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SQE coordinator memory pool is above 90%
          description: Used {{ $value | humanizePercentage }} of the DataFusion pool.

  - name: sqe.policy
    rules:
      - alert: SqeRangerCircuitOpen
        expr: sqe_policy_circuit_breaker_state{backend="ranger"} == 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ranger policy circuit breaker is open
          description: >
            Queries fail-closed (deny-all). Check Ranger Admin reachability
            and sqe_policy_resolve_duration_seconds.

  # Silent-source detection for the OCSF audit export: the SIEM must learn
  # when SQE stops sending. Series exist only when [audit.export] is configured.
  - name: sqe.audit
    rules:
      - alert: SqeAuditExportFailing
        expr: increase(sqe_audit_export_batch_failures_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: SQE audit export batches are failing
          description: >
            Audit batches have failed to ship for 15m. Events queue in the
            local spool. Check the export endpoint and its TLS.

      - alert: SqeAuditExportStalled
        # Backlog present and nothing shipped for 30m. An idle coordinator has
        # lag 0 and stays silent. last_success is 0 until the first ship, so a
        # backlog that never shipped also fires.
        expr: |
          sqe_audit_export_spool_lag_bytes > 0
            and
          (time() - sqe_audit_export_last_success_timestamp) > 1800
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: SQE audit events are not reaching the SIEM
          description: >
            {{ $value | humanize1024 }}B of audit events are waiting in the
            spool and nothing has shipped for 30m. The SIEM is missing audit
            events from this coordinator.

  # The coordinator is a single replica: down means no queries and no audit
  # events. job="sqe-coordinator" is set by the chart's ServiceMonitor.
  - name: sqe.availability
    rules:
      - alert: SqeCoordinatorDown
        expr: up{job="sqe-coordinator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The SQE coordinator scrape target is down
          description: >
            {{ $labels.instance }} has not answered a scrape for 2m. SQE serves
            no queries and emits no audit events while it is down.

      - alert: SqeCoordinatorAbsent
        # Watchdog for the watcher: SqeCoordinatorDown needs a series to fire
        # on. If the target disappears altogether (ServiceMonitor removed, job
        # relabelled, Prometheus lost the scrape config), only absent() notices.
        expr: absent(up{job="sqe-coordinator"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Prometheus has no SQE coordinator target at all
          description: >
            No up{job="sqe-coordinator"} series for 10m. Monitoring of SQE is
            blind, not quiet. Check the ServiceMonitor and the scrape config.

  - name: sqe.workers
    rules:
      - alert: SqeWorkerDown
        # job="sqe-worker" is set by deploy/helm/sqe/templates/servicemonitor.yaml
        # when worker.enabled is true. Coordinator-only installs have no series
        # and this rule stays silent.
        expr: up{job="sqe-worker"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: An SQE worker scrape target is down
          description: "{{ $labels.instance }} is not being scraped. Relabel job if your scrape config uses a different name."
