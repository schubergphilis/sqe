# Keep the High/Critical image gate active. Each exception below is scoped to
# one advisory on one package, only while grype knows no fixed version
# (fix-state: unknown, which is what Wolfi/Chainguard apk matches report), so
# it lapses by itself once a fix ships and the state turns `fixed`.
#
# CVE-2026-84243 (glibc 2.44, published 2026-10-30): no fixed glibc in
# Chainguard, Debian, RHEL, SUSE or Ubuntu as of 2026-11-06; the runtime base
# carries glibc-2.44 2.44-r13. It blocked the v0.53.0 release scan. Review
# when Chainguard ships a fix: bump the glibc-dynamic digest and delete this.
ignore:
  - vulnerability: CVE-2026-84243
    fix-state: unknown
    package:
      name: glibc-2.44
      type: apk
