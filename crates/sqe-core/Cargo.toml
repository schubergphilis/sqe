[package]
name = "sqe-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[features]
default = ["tls-native-roots"]
# Lets `sqe_core::tls::tonic_client` fall back to the platform trust store for
# an `https://` peer that has no explicit `ca_file`. Turning it off makes
# `SqeConfig::validate` refuse `https://` worker URLs unless `ca_file` is set,
# because there would then be no trust root at all.
tls-native-roots = ["tonic/tls-native-roots"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
ring = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
# `sqe_core::tls` is the single TLS builder for every SQE listener and client
# (findings 210 / 603). tonic and rustls are already in every workspace build
# via `workspace-hack`, so this adds no compile weight; it only lets the
# coordinator and the worker share one implementation instead of three.
tonic = { workspace = true }
# `default-features = false`: rustls's default set includes `aws_lc_rs` and
# `prefer-post-quantum`, which compile aws-lc-sys (a C build) next to ring.
# ring is the one provider SQE uses (`tls::ensure_crypto_provider`); with it
# as the only provider feature in the graph, rustls also selects it
# automatically for callers that never install one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Installs ring as the rustls process default before `main` (tls.rs). reqwest
# 0.13 under `rustls-no-provider` panics at client construction when no
# provider is installed, and clients are built in 25 places across a dozen
# crates plus their tests; one pre-main install in the crate every one of
# them links is the guarantee, the explicit `ensure_crypto_provider()` calls
# in the binaries' `main` are the belt to this brace.
ctor = "1"
datafusion = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# Property tests for the error classifiers (#639).
proptest = "1"
