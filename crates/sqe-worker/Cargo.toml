[package]
name = "sqe-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[lib]
name = "sqe_worker"
path = "src/lib.rs"

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-catalog = { path = "../sqe-catalog" }
sqe-planner = { path = "../sqe-planner" }
sqe-compaction = { path = "../sqe-compaction" }
sqe-metrics = { path = "../sqe-metrics" }
sqe-spill = { path = "../sqe-spill" }
iceberg = { workspace = true }
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
arrow = { workspace = true }
arrow-flight = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
parquet = { workspace = true }
object_store = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
# CancellationToken for the compact_file_group rewrite (finding 608): the
# Flight handler cancels the rewrite when the coordinator drops the response
# stream or the worker-side deadline fires.
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-futures = { version = "0.2", features = ["futures-03"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
tracing-opentelemetry = { workspace = true }
subtle = { workspace = true }
prometheus = { workspace = true }
# Per-process instance id in the heartbeat hello (review finding 609).
uuid = { workspace = true }
# Local network interface enumeration for advertise-URL derivation (issue #220).
# Used only at worker startup to pick the first non-loopback, non-link-local
# address when POD_IP / HOSTNAME are not set. Cross-platform (posix + windows).
if-addrs = "0.15"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
# `TcpListenerStream` for the in-process Flight servers in `tests/protocol`
# (finding 611): port 0 + `serve_with_incoming` so parallel test binaries
# never collide on a fixed port.
tokio-stream = { version = "0.1", features = ["net"] }
