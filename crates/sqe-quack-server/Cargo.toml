[package]
name = "sqe-quack-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[dependencies]
sqe-quack-wire = { path = "../sqe-quack-wire" }
sqe-auth = { path = "../sqe-auth" }
sqe-core = { path = "../sqe-core" }
# Trace-context propagation only: the registry crate, under the name the
# sources use (review 803 item 2). No exporters, no OTel SDK.
sqe-metrics = { path = "../sqe-metrics-core", package = "sqe-metrics-core", features = ["propagation"] }
axum = { workspace = true }
tokio = { workspace = true }
moka = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
chrono = { workspace = true }
# 606: result paging — QueryStream carries a BoxStream of RecordBatches so one
# response no longer materialises the whole result.
futures = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait = { workspace = true }
futures = { workspace = true }
