[package]
name = "sqe-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[features]
# Default ships only the REST backend (Polaris / Nessie). The kitchen-sink
# build that included `sql-postgres`, `hms`, `glue`, `hadoop`, and
# `s3tables` cost ~180-200 MB in binary size and dragged the full AWS SDK,
# Thrift / pilota, and sqlx tls-rustls graph into every Polaris-only
# deployment. Operators who need additional backends opt in by feature or
# by the `full-backends` umbrella.
#
# Approximate binary cost on top of `rest`-only: rest-sigv4 adds aws-config
# plus the SigV4 credential chain (~10-15 MB compile weight, no Glue/S3
# Tables SDK); hadoop adds ~0 (no new deps); sql-postgres ~5-10 MB; hms
# ~10-15 MB; glue ~50-80 MB (aws-sdk-glue is the heavyweight); s3tables
# adds ~5-10 MB on top of glue's AWS SDK runtime.
#
# `hadoop` and `sql-sqlite` are in the default set for one reason: sqe-cli
# requires them, and under resolver 2 every `cargo test --workspace` therefore
# already builds this crate with them on. A `cargo test -p sqe-coordinator`
# did not, so the same crate came out with a different feature set and
# catalog, compaction, worker, coordinator and its test binaries were
# compiled twice (measured 2026-09-04: 4m50s versus about 35 s for a one-line
# coordinator change). The container image is unchanged by this: it builds
# sqe-cli in the same cargo invocation, so it carried both already. Keep this
# list equal to what sqe-cli asks for; the workspace-hack crate pins the
# third-party side of the same problem.
default = ["rest", "rest-sigv4", "hive-external", "hadoop", "sql-sqlite"]
# Umbrella for the legacy default: every supported backend compiled in.
# Use when packaging an image that needs to dispatch to Polaris, Glue,
# S3 Tables, Hive Metastore, Hadoop warehouses, and Postgres-backed SQL
# catalogs.
full-backends = ["rest", "rest-sigv4", "sql-postgres", "hms", "glue", "hadoop", "s3tables", "hive-external"]
# REST catalog (the protocol Polaris and Nessie both speak). Activating
# the feature pulls in `iceberg-catalog-rest`, compiles the
# `rest_catalog` module, and registers the loader's REST builder.
# Without this feature, the slim build skips the full REST client and
# the `SessionCatalog` / `TableMetadataCache` surface that lives on top
# of it. Without `rest`, downstream consumers (sqe-coordinator,
# sqe-worker) will not compile, which is the intent for the slim path.
rest = [
    "dep:iceberg-catalog-rest",
    "iceberg-catalog-loader/rest",
]
# SigV4 request signing for REST catalogs behind AWS-signed endpoints
# (Glue Iceberg REST, S3 Tables REST; engaged at runtime via
# `rest.sigv4-enabled=true` or auto-detected AWS endpoints). Default-on
# so coordinator/worker builds can talk to AWS Iceberg REST without
# pulling in the full Glue/S3 Tables SDK backends. Slim builds that want
# zero AWS crates (Polaris/Nessie only) can use `--no-default-features
# --features rest`. `glue`, `s3tables`, and `full-backends` also enable
# it; without the feature the sigv4 catalog properties are ignored by
# the vendored REST client.
rest-sigv4 = ["rest", "iceberg-catalog-rest/aws-sigv4"]
# JDBC-style SQL catalog: the upstream iceberg-catalog-sql crate, which uses
# sqlx::any for runtime dispatch to SQLite/PostgreSQL/MySQL. rusqlite used to
# ride along here with zero call sites; it was only the lever that turned on
# libsqlite3-sys `bundled`, and workspace-hack now requests that directly.
sql = ["dep:iceberg-catalog-sql", "dep:sqlx", "iceberg-catalog-loader/sql"]
# Add-on for `sql`: enable PostgreSQL via sqlx. Kept separate so the base
# `sql` feature does not pull tls-rustls + tokio-runtime + postgres driver
# into builds that only want SQLite.
sql-postgres = ["sql", "sqlx/postgres", "sqlx/runtime-tokio", "sqlx/tls-rustls"]
# Add-on for `sql`: enable SQLite via sqlx. Used by the embedded sqe-cli
# path for a persistent local catalog at `~/.sqe/sqe.db`. No TLS, no
# Postgres driver, just the SQLite backend + tokio runtime that
# sqlx::any needs. Embedded mode picks this; cluster builds typically
# want `sql-postgres` instead.
sql-sqlite = ["sql", "sqlx/sqlite", "sqlx/runtime-tokio"]
# Pure-Rust SQLite catalog: `SqliteRsCatalog` over the vendored Lab271
# sqlite-rs embedding API (vendor/sqlite-rs). Speaks the same two-table
# schema as `sql-sqlite`, so an existing `sqe.db` opens under either. Does
# not depend on `sql`: no sqlx, no libsqlite3-sys, no C toolchain. When both
# this and `sql-sqlite` are on, the embedded and `TYPE sqlite` mount paths
# pick this one and sqlx stays the fallback for `TYPE jdbc` URLs.
sql-sqlite-rs = ["dep:sqlite-rs"]
# Hadoop storage-only backend. No extra dependency — the backend scans a
# warehouse path via `object_store`, which is already linked. Hadoop has
# no upstream loader counterpart; SQE's hadoop dispatch stays in
# `crates/sqe-catalog/src/backends/hadoop.rs`.
hadoop = []
# Hive Metastore over Thrift. Vendored from apache/iceberg-rust v0.9.0;
# pulls in volo-thrift + pilota only when this feature is enabled.
hms = ["dep:iceberg-catalog-hms", "iceberg-catalog-loader/hms"]
# AWS Glue Data Catalog. Vendored from apache/iceberg-rust v0.9.0;
# pulls in aws-sdk-glue + aws-config only when this feature is enabled.
# Co-engages aws-config + aws-credential-types so the credential layering
# helper in `aws_config.rs` can name `SdkConfig` / `Credentials` directly.
glue = [
    "dep:iceberg-catalog-glue",
    "dep:aws-sdk-glue",
    "iceberg-catalog-loader/glue",
    "dep:aws-config",
    "dep:aws-credential-types",
    "rest-sigv4",
]
# AWS S3 Tables (managed Iceberg). Pulls in aws-sdk-s3tables. Shares
# the aws-config + aws-sdk runtime already pulled by `glue`, so the
# incremental binary cost is small (~5-10 MB). Same `dep:aws-config` /
# `dep:aws-credential-types` co-engagement as `glue`.
s3tables = [
    "dep:iceberg-catalog-s3tables",
    "iceberg-catalog-loader/s3tables",
    "dep:aws-config",
    "dep:aws-credential-types",
    "rest-sigv4",
]
# Hive-style external tables (Athena/Glue CREATE EXTERNAL TABLE over CSV,
# line-delimited JSON, and Parquet) with definitions in a sidecar manifest.
# Distinct from `hms`, which is Hive Metastore holding Iceberg tables. Adds no
# new crates to the workspace: the readers are already compiled for the file
# TVFs, and `thiserror` is already in the workspace lockfile for other
# crates. It does add sqe-catalog's own first direct edge to `thiserror`,
# kept optional and `dep:`-gated behind this feature (for its `HiveError`
# type) so a build without the feature does not add the edge.
hive-external = ["dep:thiserror"]
# Delta Lake read support (delta-rs) is REMOVED for the DataFusion 54 bump.
# deltalake-core 0.32.1 targets DataFusion 53.1, so its `DeltaTableProvider`
# implements an older DataFusion's `TableProvider` trait and will not satisfy
# DF 54 (E0277 under `--all-features`). delta-rs has no DF 54 release yet.
# Re-add the `delta` feature + the deltalake-core dependency (below) and the
# `read_delta` module in src/lib.rs once delta-rs ships DF 54 support.
# delta = ["dep:deltalake-core"]

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-sql = { path = "../sqe-sql" }
# Only the interfaces (PolicyStore, GrantBackend, HiveCatalogs), not the
# policy engine: build-time item C1. With the full `sqe-policy` here the
# 22 s policy compile sat in front of this crate's on every cold build.
sqe-policy-api = { path = "../sqe-policy-api" }
sqe-metrics = { path = "../sqe-metrics" }
thiserror = { workspace = true, optional = true }
datafusion = { workspace = true }
datafusion-expr = { workspace = true }
object_store = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
iceberg = { workspace = true }
iceberg-catalog-rest = { workspace = true, optional = true }
# Catalog factory dispatch. Replaces SQE's per-backend match
# dispatch and gives every backend a uniform `load(name, props)`
# entry point. The workspace-level dep declares
# `default-features = false`; each SQE backend feature
# (rest/glue/hms/sql/s3tables) below activates the matching
# loader feature, so the loader's registry only includes builders
# the SQE binary actually links.
iceberg-catalog-loader = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
# reqwest 0.12 `Client` type for the vendored REST catalog's `with_client`.
reqwest_legacy = { workspace = true }
moka = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
iceberg-datafusion = { workspace = true }
parquet = { workspace = true }
bytes = { workspace = true }
prometheus = { workspace = true }
regex = { workspace = true }
# Puffin NDV sketches (apache-datasketches-theta-v1 blob body).
datasketches = { workspace = true }
# Zip archive reading for read_json(compression => 'zip').
zip = { workspace = true }
# Gzip decompression for read_json(compression => 'gzip') buffer path.
flate2 = { workspace = true }
# Optional backend dependencies — gated by the corresponding cargo feature
# above. None of these are pulled into a default `cargo build`.
iceberg-catalog-hms = { workspace = true, optional = true }
iceberg-catalog-glue = { workspace = true, optional = true }
iceberg-catalog-sql = { workspace = true, optional = true }
sqlite-rs = { workspace = true, optional = true }
iceberg-catalog-s3tables = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# deltalake-core REMOVED for the DataFusion 54 bump (see the `delta` feature note
# above). delta-rs has no DF 54-compatible release; 0.32.1 pins DataFusion 53.1,
# which drags a whole second DF/arrow tree into the lock and fails to satisfy DF 54.
# Restore (with an exact `=` pin, bumped together with read_delta.rs) once delta-rs
# ships DF 54:
# deltalake-core = { version = "=0.32.1", features = ["datafusion", "rustls", "cloud"], optional = true }
# AWS SDK shared config used by `aws_config.rs` to layer ATTACH options +
# secrets on top of the default credential chain. Pinned to the same
# versions aws-sdk-glue / aws-sdk-s3tables already pull in transitively.
# Kept as direct deps so the credential-layering helper can name the
# `SdkConfig` / `Credentials` types directly without going through one
# of the SDK crates' re-exports.
aws-config = { version = "1.10", optional = true }
# Direct Glue client for the `GlueMetadataSource`. Already in the tree via
# `iceberg-catalog-glue`, so a direct dependency under the same feature adds
# no binary weight.
aws-sdk-glue = { version = "1.159", default-features = false, features = ["rt-tokio"], optional = true }
aws-credential-types = { version = "1.3", optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# Tests build an InMemoryPolicyStore; production code needs only sqe-policy-api.
sqe-policy = { path = "../sqe-policy" }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
sqlparser = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
wiremock = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
sqe-auth = { path = "../sqe-auth" }
# Used in the Phase O+ integration test to deserialise an inline
# `[catalog.backend]` block into `SqeConfig` rather than constructing
# all 14 SqeConfig fields by hand.
toml = { workspace = true }
