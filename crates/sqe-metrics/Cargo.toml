[package]
name = "sqe-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[dependencies]
# Registry types and propagation helpers live in the core crate (review 803
# item 2) and are re-exported from `lib.rs`; this crate adds the exporters,
# the `/metrics` server and the audit pipeline.
sqe-metrics-core = { path = "../sqe-metrics-core", features = ["propagation"] }
prometheus = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
async-trait = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
