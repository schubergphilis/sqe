[package]
name = "sqe-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[[bin]]
name = "sqe-cli"
path = "src/main.rs"

[features]
# `aws` turns on the Glue + S3 Tables catalog backends for the embedded
# engine (`--catalog-backend glue|s3tables`). Default-OFF: as a workspace
# member, a default-on `aws` unifies aws-sdk-glue + aws-sdk-s3tables into
# the single shared sqe-catalog build of every `cargo build` /
# `cargo test` at the repo root, even though coordinator and worker
# never ask for them. Opt in with `cargo install sqe-cli --features aws`
# or `cargo build -p sqe-cli --features aws`.
default = []
aws = ["sqe-catalog/glue", "sqe-catalog/s3tables"]
# DEP-07: the `delta` feature (read_delta() TVF) is REMOVED for the DataFusion 54
# bump. deltalake-core has no DF 54 release yet. Restore this line and the
# sqe-catalog `delta` feature once delta-rs ships DF 54 support.
# delta = ["sqe-catalog/delta"]

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-catalog = { path = "../sqe-catalog", default-features = false, features = ["rest", "rest-sigv4", "sql-sqlite", "hadoop", "hive-external"] }
sqe-sql = { path = "../sqe-sql" }
sqe-trino-functions = { path = "../sqe-trino-functions" }
# Shared Trino HTTP + Flight SQL clients (review 705). Replaces the
# hand-rolled `http.rs` / `flight.rs` clients and the dependency on the
# whole `sqe-trino-compat` server crate that they carried for two structs.
sqe-trino-protocol = { path = "../sqe-trino-protocol", features = ["client", "flight"] }
sqe-policy = { path = "../sqe-policy" }
arrow = { workspace = true }
arrow-flight = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
datafusion = { workspace = true }
datafusion-functions-json = { workspace = true }
# Embedded persistent catalog: SQLite via iceberg-catalog-sql, exposed
# to DataFusion via iceberg-datafusion. Both ride along the same
# vendored iceberg-rust workspace the cluster already uses.
iceberg = { workspace = true }
iceberg-catalog-sql = { workspace = true }
iceberg-datafusion = { workspace = true }
# DashMap powers the writable catalog's per-name schema cache; same
# concurrency-friendly map iceberg-datafusion uses for its own
# table-level cache.
dashmap = { workspace = true }
tonic = { workspace = true, features = ["transport", "tls-native-roots"] }
tokio = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
rustyline = "18"
rpassword = "7"
async-trait = { workspace = true }
anyhow = { workspace = true }
# Hive external-table DDL in embedded mode (Task 9): destructuring
# `Statement::Drop` / `Statement::ShowCreate` to branch on a Hive root
# before falling through to DataFusion's own DDL path.
sqlparser = { workspace = true }
# `HiveManifest::from_spec`'s `created_at` and this crate's own manifest
# `owner`/timestamp stamping for CREATE EXTERNAL TABLE.
chrono = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
