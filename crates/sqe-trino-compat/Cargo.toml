[package]
name = "sqe-trino-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-auth = { path = "../sqe-auth" }
sqe-sql = { path = "../sqe-sql" }
sqe-metrics = { path = "../sqe-metrics" }
# Session-control and prepared-statement handling reads the AST the SQL front
# door produced (USE targets, EXECUTE arguments) instead of the statement text.
sqlparser = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
moka = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
# Result cursor: batch stream + memory-pool accounting for the buffered page (#621).
datafusion = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true

[dev-dependencies]
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
# tests/wire.rs drives the real HTTP listener the way a Trino client does
# (POST, follow nextUri, DELETE) and diffs the JSON against goldens. Issue #630.
reqwest = { workspace = true }
# Identity / literal-preservation properties for the source-level rewriters.
proptest = "1"
