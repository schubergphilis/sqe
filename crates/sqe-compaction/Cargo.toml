[package]
name = "sqe-compaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[lib]
name = "sqe_compaction"
path = "src/lib.rs"

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-catalog = { path = "../sqe-catalog" }
# `MetricsRegistry` only: the registry crate, under the name the sources use
# (review 803 item 2). No exporters, no OTel SDK, no `/metrics` server.
sqe-metrics = { path = "../sqe-metrics-core", package = "sqe-metrics-core" }
datafusion = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
iceberg = { workspace = true }
parquet = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
