[package]
name = "sqe-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-auth = { path = "../sqe-auth" }
sqe-sql = { path = "../sqe-sql" }
# The Arrow-to-JSON value encoder only; the Trino server crate is not linked
# here any more (review 803, item 3).
sqe-trino-protocol = { path = "../sqe-trino-protocol", features = ["arrow"] }
sqe-metrics-core = { path = "../sqe-metrics-core", features = ["propagation"] }
arrow-array = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlparser = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true

[dev-dependencies]
arrow-schema = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
# `start_paused` for the describe_schema deadline test: the 20 s probe
# timeout fires on a paused clock instead of being waited for.
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
