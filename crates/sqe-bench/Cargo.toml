[package]
name = "sqe-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[lib]
name = "sqe_bench"
path = "src/lib.rs"

[[bin]]
name = "sqe-bench"
path = "src/main.rs"

[dependencies]
# Shared Trino HTTP client (with faithful Arrow decoding) and Flight SQL
# client (review 705). The bench used to link the whole `sqe-trino-compat`
# server crate for `TrinoResponse`/`TrinoColumn`.
sqe-trino-protocol = { path = "../sqe-trino-protocol", features = ["client", "arrow", "flight"] }
# Tokenizer-based table qualification for `--qualify-tables` (review 707):
# aliases and literals are tokens, not substrings, so they are never touched.
sqlparser = { workspace = true }
clap = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
iceberg = { workspace = true }
iceberg-catalog-rest = { workspace = true }
parquet = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
# reqwest is `rustls-no-provider` workspace-wide; sqe-bench does not link
# sqe-core, so main.rs installs the ring provider before anything builds a
# client (the Flight client's OIDC exchange in client/flight.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
csv = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
futures = { workspace = true }
