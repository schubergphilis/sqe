[package]
name = "sqe-planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-spill = { path = "../sqe-spill" }
datafusion = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Shared coordinator/worker protocol types (review findings 109 / 602 / 609):
# `WorkerFault` encodes into a tonic `Status`, classifies `object_store`
# errors, and `WorkerHello` carries a per-process `Uuid`. All three are
# already in every workspace build via `workspace-hack`.
tonic = { workspace = true }
object_store = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true }
arrow = { workspace = true }
