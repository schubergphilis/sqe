[package]
name = "sqe-planner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[features]
default = []
# Stage-based shuffle planning nodes (`shuffle_exec.rs`, `distributed_join.rs`).
# No coordinator module builds these plans today -- the executed topology is a
# distributed scan with coordinator-side joins -- so they are compiled out by
# default and kept for the stage-execution roadmap (review finding 600).
shuffle-planning = []

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-spill = { path = "../sqe-spill" }
datafusion = { workspace = true }
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true }
arrow = { workspace = true }
