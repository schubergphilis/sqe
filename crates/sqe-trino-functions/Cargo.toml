[package]
name = "sqe-trino-functions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

# Trino-compatible scalar UDFs for DataFusion.
#
# Split out of `sqe-coordinator` so an edit to the coordinator's query or
# write handlers does not force ~4.2k LOC of UDF code (plus its deps:
# unicode-normalization, rust-stemmers, chrono-tz, regex) to recompile.
# See openspec change `split-trino-functions` for the rationale.

[dependencies]
arrow = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# These four deps move here with the code — nothing else in the workspace
# uses them, so pulling them out of sqe-coordinator's dep graph is the main
# incremental-build win of this split.
regex = { workspace = true }
unicode-normalization = { workspace = true }
rust-stemmers = { workspace = true }
chrono-tz = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true }
datafusion-functions-json = { workspace = true }
# `variant_json_args_test` needs the base crate's variant helpers and the
# Trino UDF registry in one session. Dev-only: the dependency points down the
# graph (feature crate -> core), never the other way.
sqe-core = { path = "../sqe-core" }
