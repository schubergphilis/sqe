<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>SQE</title>
<style>
  /* Self-contained on purpose: the page is compiled into the coordinator and
     may run air-gapped, so no webfonts, CDNs, icon sets or build step. Every
     colour is a token below; the dark set follows the OS preference. */
  :root {
    --bg:#F3F6FB; --surface:#FFFFFF; --panel:#E8F2FD; --line:#DCE6F2;
    --text:#020C17; --text-2:#5A6782; --text-3:#8391A8;
    --accent:#1E80ED; --accent-soft:#E1EEFD; --marker:#FFDB4E;
    --ok:#0E8A61; --ok-soft:#DCF4EA; --bad:#C92A62; --bad-soft:#FDE6EE;
    --warn:#A65A00; --warn-soft:#FFF1D6; --warn-line:#F5A524;
    --head-bg:#082646; --head-text:#FFFFFF; --head-mut:#AACBEF; --head-line:#082646;
    --tip-bg:#0B1B2E; --tip-text:#FFFFFF;
    --mut:var(--text-2);          /* kept for older inline styles */
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#030B16; --surface:#071628; --panel:#0A2038; --line:#15304D;
      --text:#E6EEF8; --text-2:#93A6C0; --text-3:#64799A;
      --accent:#4EA1F5; --accent-soft:#0E2C50; --marker:#FFDB4E;
      --ok:#4AD6A0; --ok-soft:#0C3529; --bad:#FF6F9C; --bad-soft:#3A1428;
      --warn:#FFBE5C; --warn-soft:#2E2210; --warn-line:#E39B2A;
      --head-bg:#030B16; --head-text:#E6EEF8; --head-mut:#93A6C0; --head-line:#15304D;
      --tip-bg:#E6EEF8; --tip-text:#030B16;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  /* ── header: brand, grouped tabs (eyebrow per group), node meta ── */
  header { background:var(--head-bg); color:var(--head-text);
           border-bottom:1px solid var(--head-line);
           display:flex; align-items:flex-end; flex-wrap:wrap; gap:.5rem 2rem;
           padding:.75rem 1.5rem 0; }
  .brand { display:flex; flex-direction:column; gap:.2rem; padding-bottom:.8rem; }
  .brand .eyebrow { font-family:var(--mono); font-size:10.5px; font-weight:700;
                    letter-spacing:.06em; text-transform:uppercase; color:var(--head-mut); }
  .brand .wordmark { font-size:20px; font-weight:900; line-height:1; }
  .brand .marker { width:40px; height:3px; background:var(--marker); margin-top:.25rem; }
  nav { display:flex; gap:1.75rem; }
  .navgrp { display:flex; flex-direction:column; }
  .navgrp > span { font-size:11px; color:var(--head-mut); padding-left:.6rem; }
  .navgrp > div { display:flex; }
  nav button { background:none; border:none; color:var(--head-mut); cursor:pointer;
               padding:.35rem .6rem .7rem; font-weight:600;
               border-bottom:2px solid transparent; }
  nav button:hover { color:var(--head-text); }
  nav button.active { color:var(--head-text); border-bottom-color:var(--accent); }
  #meta { margin-left:auto; padding-bottom:.9rem; font-family:var(--mono);
          font-size:12px; color:var(--head-mut); }

  main { max-width:1320px; margin:0 auto; padding:1.5rem; }
  #overview, #queries, #history, #cluster, #detail { min-height:40vh; }
  #detail.hidden { display:none; }

  /* ── page head: eyebrow, title, marker, one-sentence summary ── */
  .crumb { font-size:12.5px; color:var(--text-2); margin-bottom:.15rem; }
  .crumb .mono { font-family:var(--mono); }
  h1 { margin:0; font-size:24px; font-weight:800; letter-spacing:-.01em;
       display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  h1 .mono { font-family:var(--mono); font-size:19px; }
  .marker { width:56px; height:4px; background:var(--marker); margin:.45rem 0 .6rem; }
  .summary { margin:0 0 1.1rem; color:var(--text-2); max-width:90ch; }
  .summary b { color:var(--text); font-weight:700; font-variant-numeric:tabular-nums; }
  h2 { margin:1.6rem 0 .6rem; font-size:12px; font-weight:700; letter-spacing:.06em;
       text-transform:uppercase; color:var(--text-2); }
  h2 .aside { float:right; text-transform:none; letter-spacing:0; font-weight:500; }

  /* ── banners: a condition plus the action that addresses it ── */
  .banner { display:flex; align-items:center; gap:.75rem; margin:0 0 .6rem;
            padding:.65rem 1rem; border-radius:8px; border-left:3px solid;
            background:var(--warn-soft); border-color:var(--warn-line); }
  .banner svg { flex:none; color:var(--warn); }
  .banner .msg { flex:1; }
  .banner.bad { background:var(--bad-soft); border-color:var(--bad); }
  .banner.bad svg { color:var(--bad); }
  .banner button { background:none; border:none; cursor:pointer; font-weight:600;
                   color:var(--text); white-space:nowrap; padding:.2rem .3rem; }
  .banner button:hover { color:var(--accent); }
  #err { display:none; margin:1rem 1.5rem 0; }

  /* ── pills (state, role, health) ── */
  .pill { display:inline-flex; align-items:center; gap:.35rem; padding:.05rem .55rem;
          border-radius:999px; font-size:12px; font-weight:600; line-height:1.6;
          background:var(--panel); color:var(--text-2); white-space:nowrap; }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.plain::before { display:none; }
  .s-RUNNING, .s-QUEUED, .s-PLANNING { background:var(--accent-soft); color:var(--accent); }
  .s-FINISHED, .s-HEALTHY { background:var(--ok-soft); color:var(--ok); }
  .s-FAILED, .s-CANCELED, .s-DOWN { background:var(--bad-soft); color:var(--bad); }
  .s-RUNNING::before { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .s-RUNNING::before { animation:none; } }

  /* ── metric strip: one panel, a column per figure ── */
  .strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
           background:var(--panel); border-radius:10px; overflow:hidden; }
  .strip > div { padding:.9rem 1.1rem .7rem; display:flex; flex-direction:column; gap:.15rem;
                 border-right:1px solid var(--line); }
  .strip > div:last-child { border-right:none; }
  .strip .lbl { font-size:12px; color:var(--text-2); }
  .strip .val { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;
                line-height:1.25; }
  .strip .val.bad { color:var(--bad); }
  .strip .sub { font-size:12px; color:var(--text-3); }
  .stat-spark { width:100%; height:30px; overflow:visible; display:block; margin-top:.2rem; }

  /* ── panels ── */
  .grid2 { display:grid; grid-template-columns:minmax(0,2fr) minmax(260px,1fr); gap:1rem; }
  @media (max-width:880px) { .grid2 { grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px;
          padding:1rem 1.15rem; }
  .card + .card { margin-top:1rem; }
  .gauge-head { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; }
  .gauge-title { font-size:12.5px; color:var(--text-2); }
  .gauge-pct { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  .gauge-pct.warn { color:var(--warn); }
  .bar-track { background:var(--panel); border-radius:4px; height:6px; overflow:hidden;
               margin:.45rem 0 .4rem; }
  .bar-fill { height:100%; border-radius:4px; background:var(--accent); }
  .bar-fill.warn { background:var(--warn-line); }
  svg.spark { width:100%; height:34px; overflow:visible; display:block; }
  .hist-muted { color:var(--text-3); font-style:italic; margin:.5rem 0; }
  .hist-legend { display:flex; align-items:center; flex-wrap:wrap; gap:.4rem 1rem;
                 margin-top:.6rem; font-size:12px; color:var(--text-2); }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:.35rem;
        vertical-align:-1px; }
  .hist-caption { margin-left:auto; color:var(--text-3); }
  .hist-axis { display:flex; justify-content:space-between; font-family:var(--mono);
               font-size:11px; color:var(--text-3); margin-top:.3rem; }

  /* key/value grid */
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.9rem 1.5rem;
        background:var(--panel); border-radius:10px; padding:1rem 1.15rem;
        font-variant-numeric:tabular-nums; }
  .kv > div { display:flex; flex-direction:column; min-width:0; }
  .kv .k { font-size:12px; color:var(--text-2); }
  .kv .v { font-weight:600; overflow-wrap:anywhere; }
  .kv .v.mono { font-family:var(--mono); font-weight:500; font-size:13px; }

  /* ── tables: sortable headers, inline bars, quiet rules ── */
  .tablewrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px;
               background:var(--surface); }
  table { width:100%; border-collapse:collapse; }
  thead th { text-align:left; font-size:12.5px; font-weight:600; color:var(--text-2);
             padding:.55rem .75rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  thead th.num { text-align:right; font-family:var(--font); font-size:12.5px; }
  button.sort { background:none; border:none; padding:0; cursor:pointer; font-weight:600;
                color:inherit; display:inline-flex; align-items:center; gap:.3rem; }
  button.sort:hover { color:var(--text); }
  button.sort svg { opacity:.45; }
  th[aria-sort="ascending"] button.sort, th[aria-sort="descending"] button.sort { color:var(--text); }
  th[aria-sort="ascending"] button.sort svg, th[aria-sort="descending"] button.sort svg { opacity:1; color:var(--accent); }
  tbody td { padding:.55rem .75rem; border-bottom:1px solid var(--line);
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46ch; }
  tbody tr:last-child td { border-bottom:none; }
  tr[data-id] { cursor:pointer; }
  tr[data-id]:hover, tr[data-id]:focus-visible { background:var(--panel); outline:none; }
  .num { text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:13px; }
  .id { font-family:var(--mono); font-size:13px; font-weight:600; }
  .sqlc { font-family:var(--mono); font-size:12.5px; color:var(--text-2); }
  .cellbar { display:inline-flex; align-items:center; justify-content:flex-end; gap:.55rem; }
  .cellbar .track { width:52px; height:5px; border-radius:3px; background:var(--panel); overflow:hidden; }
  .cellbar .track i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  .empty { padding:2rem; text-align:center; color:var(--text-3); }

  /* ── history toolbar ── */
  .toolbar { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-bottom:.75rem; }
  .toolbar select, .toolbar button, button.more {
      font:inherit; font-size:13px; padding:.35rem .7rem; border-radius:6px; cursor:pointer;
      border:1px solid var(--line); background:var(--surface); color:var(--text); }
  .toolbar button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .toolbar .count { margin-left:auto; color:var(--text-2); font-size:13px; }
  button.more { display:block; margin:.9rem auto 0; }

  /* ── query detail ── */
  a.back { color:var(--accent); cursor:pointer; font-weight:600; font-size:13px;
           display:inline-block; margin-bottom:.6rem; text-decoration:none; }
  a.back:hover { text-decoration:underline; }
  .timing { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--panel);
            margin:.2rem 0 .5rem; }
  .timing i { display:block; height:100%; min-width:2px; }
  .t-q { background:var(--text-3); } .t-p { background:var(--warn-line); } .t-e { background:var(--accent); }
  pre.sql { background:var(--panel); border-radius:10px; padding:1rem 1.15rem; margin:0;
            font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; overflow:auto; }
  pre.sql .hash { color:var(--text-3); }
  .errbox { color:var(--bad); font-weight:600; }

  /* tooltip */
  #tip { position:absolute; pointer-events:none; display:none; z-index:9999;
         background:var(--tip-bg); color:var(--tip-text); font:600 12px var(--mono);
         padding:.3rem .55rem; border-radius:5px; white-space:nowrap; }

  @media (max-width:640px) {
    header, main { padding-left:1rem; padding-right:1rem; }
    #meta { display:none; }
    nav { gap:.75rem; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="eyebrow">Sovereign query engine</div>
    <div class="wordmark">SQE</div>
    <div class="marker"></div>
  </div>
  <nav aria-label="Sections">
    <div class="navgrp"><span>Engine</span><div>
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="cluster">Cluster</button>
    </div></div>
    <div class="navgrp"><span>Workload</span><div>
      <button data-tab="queries">Queries</button>
      <button data-tab="history">History</button>
    </div></div>
  </nav>
  <span id="meta"></span>
</header>
<div id="err" class="banner bad" role="alert"></div>
<main>
<div id="overview"></div>
<div id="queries" style="display:none"></div>
<div id="history" style="display:none"></div>
<div id="cluster" style="display:none"></div>
<div id="detail" class="hidden"></div>
</main>

<!-- Shared tooltip: lives outside the tab containers so it survives innerHTML rewrites -->
<div id="tip"></div>

<!-- nosemgrep: opt.aikido.semgrep-rules.html.security.audit.insecure-document-method -- every innerHTML write below passes engine values through esc() first -->
<script>
const $ = s => document.querySelector(s);
let tab = "overview", current = null;

// HTML-escape every value that comes from the engine (usernames, SQL, error
// messages, worker URLs are user- or config-controlled). Without this, a query
// whose SQL contains "<script>" would execute in an operator's browser
// (stored XSS). No DOMPurify dep: this page has no build step.
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>(
  {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
// State strings come from our own enum; strip to A-Z before using as a CSS class.
function stClass(s){ return "s-"+String(s).replace(/[^A-Z]/g,""); }
function pill(s){ return `<span class="pill ${stClass(s)}">${esc(String(s||"").toLowerCase())}</span>`; }
function fmtBytes(n){ if(!n) return "0"; const u=["B","KB","MB","GB","TB"];
  let i=0,v=n; while(v>=1024&&i<u.length-1){v/=1024;i++;} return v.toFixed(1)+u[i]; }
function ms(n){ return (n|0)>=1000 ? ((n|0)/1000).toFixed(2)+"s" : (n|0)+"ms"; }
function num(n){ return (Number(n)||0).toLocaleString(); }
function pct(v, max){ return max>0 ? Math.max(0, Math.min(100, v/max*100)).toFixed(1) : "0"; }
function dash(v){ return (v==null||v===0||v==="")?"&mdash;":esc(v); }
function fmtDur(s){ s=s|0; const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${s%60}s` : `${s}s`; }
function elapsed(q){ return (q.executionMs||0)+(q.planningMs||0)+(q.queuedMs||0); }
// Format a Unix-epoch-ms timestamp as local HH:MM for chart tooltips.
function hhmm(unixMs){ return new Date(unixMs).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }

const ICON_WARN = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>`;
const ICON_SORT = `<svg width="9" height="12" viewBox="0 0 9 12" aria-hidden="true"><path d="M4.5 0 9 5H0zM4.5 12 0 7h9z" fill="currentColor"/></svg>`;

async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error(u+" "+r.status);
  return r.json(); }

function showErr(e){ const el=$("#err");
  // nosemgrep: opt.aikido.semgrep-rules.html.security.audit.insecure-document-method -- the message passes through esc()
  el.innerHTML = ICON_WARN+`<span class=msg>Lost connection to the coordinator: ${esc(e.message)}</span>`;
  el.style.display="flex"; }
function clearErr(){ $("#err").style.display="none"; }

// A banner names a condition and the action that addresses it. `act` is the
// key of a fixed entry in ACTIONS, never engine data.
const ACTIONS = {
  queries:   () => switchTab("queries"),
  cluster:   () => switchTab("cluster"),
  failedHr:  () => { hist.range="3600"; hist.state="failed"; hist.loaded=false; switchTab("history"); },
};
function banner(kind, msgHtml, act, label){
  return `<div class="banner ${kind}" role="status">${ICON_WARN}<span class=msg>${msgHtml}</span>`+
    (act?`<button data-act="${esc(act)}">${esc(label)} &rarr;</button>`:"")+`</div>`;
}

// ── Shared tooltip (event-delegated) ──────────────────────────────────────────
// The #tip div is static in <body> and never overwritten. Listeners are
// attached once to document, reading the data-tip attribute of hovered SVG
// elements. Using pageX/pageY keeps positioning correct regardless of any
// positioned ancestors.
const tip = $("#tip");
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) return;
  tip.textContent = t.getAttribute("data-tip");
  tip.style.display = "block";
});
document.addEventListener("mousemove", e => {
  if (!e.target.closest("[data-tip]")) return;
  tip.style.left = (e.pageX + 14) + "px";
  tip.style.top  = (e.pageY - 30) + "px";
});
document.addEventListener("mouseout", e => {
  if (!e.target.closest("[data-tip]")) return;
  tip.style.display = "none";
});
document.addEventListener("touchstart", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  const touch = e.touches[0];
  tip.textContent = t.getAttribute("data-tip");
  tip.style.left  = (touch.pageX + 14) + "px";
  tip.style.top   = (touch.pageY - 30) + "px";
  tip.style.display = "block";
}, { passive: true });

// ── Sortable tables ──────────────────────────────────────────────────────────
// Sort state lives here, outside the 2 s re-render, so a chosen order survives
// the refresh. Clicking a header cycles: natural direction, reversed, off
// (server order). Numbers start descending, text ascending.
const sorts = { q:{k:null,d:1}, h:{k:null,d:1}, w:{k:null,d:1} };
const redraw = { q:()=>drawQueries(), h:()=>drawHistory(), w:()=>drawCluster() };
function colGet(c){ return c.get || (r => r[c.k]); }
function sortRows(t, rows, cols){
  const s = sorts[t]; if(!s.k) return rows;
  const c = cols.find(c=>c.k===s.k); if(!c) return rows;
  const g = colGet(c);
  return rows.slice().sort((a,b)=>{
    const x=g(a), y=g(b);
    return (c.n ? (Number(x)||0)-(Number(y)||0) : String(x??"").localeCompare(String(y??""))) * s.d;
  });
}
function thead(t, cols){
  const s = sorts[t];
  return "<thead><tr>"+cols.map(c=>{
    const aria = s.k===c.k ? (s.d>0?"ascending":"descending") : "none";
    return `<th${c.n?" class=num":""} aria-sort="${aria}"><button class=sort data-t="${esc(t)}" data-k="${esc(c.k)}">`+
      `${esc(c.l)}${ICON_SORT}</button></th>`;
  }).join("")+"</tr></thead>";
}
document.addEventListener("click", e => {
  const b = e.target.closest("button.sort");
  if (b) {
    const s = sorts[b.dataset.t]; if(!s) return;
    const cols = { q:QCOLS, h:HCOLS, w:WCOLS }[b.dataset.t];
    const c = cols.find(c=>c.k===b.dataset.k); if(!c) return;
    const first = c.n ? -1 : 1;
    if (s.k!==c.k) { s.k=c.k; s.d=first; } else if (s.d===first) s.d=-first; else s.k=null;
    redraw[b.dataset.t]();
    return;
  }
  const a = e.target.closest("button[data-act]");
  if (a && ACTIONS[a.dataset.act]) { ACTIONS[a.dataset.act](); return; }
  const r = e.target.closest("tr[data-id]");
  if (r) openRow(r);
});
document.addEventListener("keydown", e => {
  if (e.key!=="Enter") return;
  const r = e.target.closest && e.target.closest("tr[data-id]");
  if (r) openRow(r);
});
function openRow(r){
  if (r.closest("#history")) openDetail(r.dataset.id, histById.get(r.dataset.id));
  else if (r.closest("#queries")) openDetail(r.dataset.id);
}
// Value with a bar scaled to the largest value on the page.
function barCell(text, v, max){
  return `<td class=num><span class=cellbar><span class=track><i style="width:${pct(v,max)}%"></i></span>${text}</span></td>`;
}

// ── SVG histogram ──────────────────────────────────────────────────────────
// Stacked bars per bucket: finished (b.finished) below, failed (b.failed) on
// top. Each bar gets a transparent hit-target rect carrying the data-tip label.
function buildHistSvg(buckets, W, H) {
  if (!buckets || buckets.length === 0) return "";
  const maxVal = Math.max(...buckets.map(b => (b.finished||0)+(b.failed||0)), 1);
  const n = buckets.length;
  const gap = 2;
  const barW = Math.max(1, Math.floor((W - gap * (n - 1)) / n));
  let bars = "";
  for (let i = 0; i < n; i++) {
    const x = i * (barW + gap);
    const fin  = buckets[i].finished||0;
    const fail = buckets[i].failed||0;
    const totalQ = fin + fail;
    const totalH = Math.round((totalQ / maxVal) * H);
    const failH  = Math.round((fail / maxVal) * H);
    if (fin > 0) bars += `<rect x="${x}" y="${H - totalH + failH}" width="${barW}" height="${totalH - failH}" rx="1" fill="var(--accent)" />`;
    if (fail > 0) bars += `<rect x="${x}" y="${H - failH}" width="${barW}" height="${failH}" rx="1" fill="var(--bad)" />`;
    if (totalQ === 0) bars += `<rect x="${x}" y="${H - 2}" width="${barW}" height="2" fill="var(--line)" />`;
    const label = `${hhmm(buckets[i].tUnixMs)} · ${fin} completed, ${fail} failed`;
    bars += `<rect x="${x}" y="0" width="${barW}" height="${H}" fill="transparent" data-tip="${esc(label)}" style="cursor:crosshair" />`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="Queries per minute, last hour">${bars}</svg>`;
}

// ── SVG sparkline (polyline + per-point hover rects) ─────────────────────────
// `series` is [{val, label}]; `color` is a CSS color string.
function sparklineSvg(series, color, W, H, cssClass) {
  if (!series || series.length < 2) return `<svg class="${cssClass||"stat-spark"}" viewBox="0 0 ${W} ${H}"></svg>`;
  const vals = series.map(p => p.val);
  const maxV = Math.max(...vals, 0.001);
  const xy = vals.map((v, i) => [(i / (vals.length - 1)) * W, H - (v / maxV) * (H - 4) - 2]);
  const pts = xy.map(([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const areaPath = `M0,${xy[0][1].toFixed(1)} ` + xy.slice(1).map(([x,y]) => `L${x.toFixed(1)},${y.toFixed(1)}`).join(" ") + ` L${W},${H} L0,${H} Z`;
  const [lx, ly] = xy[xy.length-1];
  const colW = W / vals.length;
  let targets = "";
  for (let i = 0; i < series.length; i++) {
    targets += `<rect x="${(i*colW).toFixed(1)}" y="0" width="${colW.toFixed(1)}" height="${H}" fill="transparent" data-tip="${esc(series[i].label)}" style="cursor:crosshair" />`;
  }
  return `<svg class="${cssClass||"stat-spark"}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
    `<path d="${areaPath}" fill="${color}" opacity="0.12" />` +
    `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />` +
    `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.5" fill="${color}" vector-effect="non-scaling-stroke" />` +
    targets + `</svg>`;
}
function bucketSeries(buckets, valFn, labelFn) {
  return buckets.map(b => ({ val: valFn(b), label: labelFn(b) }));
}

async function renderHistory(reset){

    `</div>`+
    `<div class=tablewrap><table>${thead("w", WCOLS)}<tbody>`+
    (list.length ? list.map(x=>`<tr><td class=sqlc>${esc(x.url)}</td>`+
      `<td>${x.healthy?'<span class="pill s-HEALTHY">healthy</span>':'<span class="pill s-DOWN">unhealthy</span>'}</td>`+
      barCell(num(x.inFlight), x.inFlight|0, maxIn)+`</tr>`).join("")
      : `<tr><td colspan=3 class=empty>No workers registered.</td></tr>`)+
    "</tbody></table></div>";
}

function switchTab(t){
  tab=t; current=null; $("#detail").classList.add("hidden");
  document.querySelectorAll("nav button").forEach(b=>
    b.classList.toggle("active", b.dataset.tab===t));
  $("#overview").style.display = t==="overview" ? "" : "none";
  $("#queries").style.display  = t==="queries"  ? "" : "none";
  $("#history").style.display  = t==="history"  ? "" : "none";
  $("#cluster").style.display  = t==="cluster"  ? "" : "none";
  tick();
}
document.querySelectorAll("nav button").forEach(b=>
  b.onclick=()=>switchTab(b.dataset.tab));

function tick(){ if(current!==null) return;
  if(tab==="overview") renderOverview();
  else if(tab==="queries") renderQueries();
  else if(tab==="history") { if(!hist.loaded) renderHistory(true); }
  else renderCluster(); }
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
