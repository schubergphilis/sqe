[package]
name = "sqe-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[features]
# Opt-in for integration tests that spin up a SQLite-backed Iceberg
# catalog: `cargo test -p sqe-coordinator --features test-sqlite`. The
# SQLite engine (`sqe-catalog/sql-sqlite-rs`, pure Rust) is in sqe-catalog's
# default set, which makes the backend part of this feature a no-op; it
# stays as the switch that compiles the `#[cfg(feature = "test-sqlite")]`
# tests in.
#
# Architecture review 513: the feature also compiles the shared in-process
# write rig (`src/test_support/sqlite_rig.rs`). That rig drives the REAL
# `WriteHandler` commit paths through a `SessionCatalog`, and the only
# non-REST `SessionCatalog` constructor that reaches a sqlite file is
# `CatalogBackend::Jdbc` (`sqlite://...`). Since 2026-09-10 that arm is
# served by `sqe-catalog/sql-sqlite-rs`; it no longer needs
# `sqe-catalog/sql-postgres` (the sqlx `any` driver set), so a
# `--features test-sqlite` build carries no sqlx and no libsqlite3.
# `tempfile` backs the rig's per-test warehouse directory and is a normal
# (optional) dependency here because the rig is `pub` library code under the
# feature, not only `cfg(test)` code.
#
# Since the write path moved to `sqe-write` (2026-09-07) the rig lives there;
# this feature forwards so `sqe_coordinator::test_support` keeps resolving.
test-sqlite = ["sqe-write/test-sqlite", "sqe-catalog/sql-sqlite-rs", "dep:tempfile"]
# `[[hive.roots]] kind = "glue"`: read table metadata from the AWS Glue Data
# Catalog. Off by default because the Glue client is the heavyweight AWS SDK
# dependency the slim build exists to avoid.
glue = ["sqe-catalog/glue"]

[lib]
name = "sqe_coordinator"
path = "src/lib.rs"

[[bin]]
name = "sqe-server"
path = "src/bin/sqe_server.rs"

[dependencies]
sqe-core = { path = "../sqe-core" }
sqe-auth = { path = "../sqe-auth" }
sqe-catalog = { path = "../sqe-catalog" }
sqe-compaction = { path = "../sqe-compaction" }
sqe-write = { path = "../sqe-write" }
sqe-sql = { path = "../sqe-sql" }
sqe-policy = { path = "../sqe-policy" }
sqe-planner = { path = "../sqe-planner" }
sqe-trino-functions = { path = "../sqe-trino-functions" }
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
arrow = { workspace = true }
arrow-flight = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
# QUACK-05: TLS for the axum-based Quack listener. `tls-rustls-no-provider`
# avoids pulling rustls/aws-lc-rs; we install the ring provider explicitly so
# the Quack endpoint uses the same crypto backend as the tonic Flight path.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# Same shape as sqe-core: no rustls defaults, or `aws_lc_rs` comes back in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
dashmap = { workspace = true }
moka = { workspace = true }
governor = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
prost = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
datafusion-functions-json = { workspace = true }
datafusion-expr = { workspace = true }
sqlparser = { workspace = true }
iceberg = { workspace = true }
parquet = { workspace = true }
sqe-metrics = { path = "../sqe-metrics" }
sqe-trino-compat = { path = "../sqe-trino-compat" }
sqe-quack-server = { path = "../sqe-quack-server" }
sqe-quack-client = { path = "../sqe-quack-client" }
sqe-mcp = { path = "../sqe-mcp" }
sqe-lineage = { path = "../sqe-lineage" }
prometheus = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
sqe-worker = { path = "../sqe-worker" }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
tower = { version = "0.5", features = ["util"] }
# Enabled only by the `test-sqlite` feature (see above): the in-process write
# rig's per-test warehouse directory. Also a dev-dependency below for the
# plain `cargo test` build.
tempfile = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
opentelemetry_sdk = { workspace = true }
# Test-only: TcpListenerStream, so the Flight SQL smoke test can serve on an
# OS-assigned port. Both production entry points hand tonic a SocketAddr and
# let it bind, which cannot report the port back.
tokio-stream = "0.1"

toml = { workspace = true }
sqe-core = { path = "../sqe-core" }
sqe-auth = { path = "../sqe-auth" }
sqe-quack-server = { path = "../sqe-quack-server" }
sqe-quack-wire = { path = "../sqe-quack-wire" }
# Tests for the runtime catalog registry are gated behind the `test-sqlite`
# feature above rather than a dev-dep feature override, so that a per-crate
# build resolves sqe-catalog exactly as the workspace build does.
sqe-catalog = { path = "../sqe-catalog" }
sqe-sql = { path = "../sqe-sql" }
sqe-policy = { path = "../sqe-policy" }
sqe-planner = { path = "../sqe-planner" }
sqe-metrics = { path = "../sqe-metrics" }
sqe-trino-compat = { path = "../sqe-trino-compat" }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
iceberg = { workspace = true }
sqlparser = { workspace = true }
parquet = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
datafusion-functions-json = { workspace = true }
datafusion = { workspace = true }
# Test-only: the Hive external-table object-storage e2e test (Task 11)
# uploads fixture files to real RustFS and reads back the manifest/data
# objects directly, the same client `sqe-catalog`'s hive/store.rs uses in
# production (`AmazonS3Builder`). Not a production dependency of this crate.
object_store = { workspace = true }
