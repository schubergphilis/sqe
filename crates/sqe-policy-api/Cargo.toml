[package]
name = "sqe-policy-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Policy and grant interfaces shared by sqe-catalog and sqe-policy: PolicyStore, ResolvedPolicy, MaskType, GrantBackend, HiveCatalogs"

