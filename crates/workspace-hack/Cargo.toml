# Managed by hand, outside the hakari section. `iceberg-catalog-loader` is in
# .config/hakari.toml's final-excludes because its `all` feature set drags the
# optional glue/hms/s3tables backends into every build. The default workspace
# build enables `rest` (sqe-catalog default); without this line a per-crate
# build could resolve the loader differently, which is a different loader,
# hence a different sqe-catalog, sqe-worker and sqe-coordinator. Pin the
# default union here so every selection shares one build. Keep it in step
# with sqe-cli's sqe-catalog features.
#
# 2026-09-10: `sql` left this pin, and the hand pins on `sqlx` (with
# `sqlite`) and `libsqlite3-sys` (`bundled`) below it are gone. sqe-cli's
# embedded catalog runs on the pure-Rust `sqe-catalog/sql-sqlite-rs`, so no
# default build reaches sqlx or the C library any more; both stay opt-in
# behind `sql-postgres` / `sql-sqlite` and are unified by cargo on demand.
[dependencies.iceberg-catalog-loader]
path = "../../vendor/iceberg-rust/crates/catalog/loader"
default-features = false
features = ["rest"]
