[toolchain]
# Bumped 1.92.0 -> 1.97.1 to clear the MSRV floor that blocked several
# dependency updates: sqlx 0.9 requires rustc 1.94.0, and the aws-sdk /
# aws-config 1.10 family requires 1.94.1. sqlx 0.9 in turn lifts
# libsqlite3-sys to 0.38, which resolves the `links = "sqlite3"` conflict
# blocking rusqlite 0.40.
#
# This pins the toolchain used for development and CI. The crates' declared
# minimum supported Rust version, `rust-version` in Cargo.toml, is 1.99: the
# atomics use `try_update`, which 1.99 stabilized when it deprecated
# `fetch_update`.
channel = "1.99.0"
