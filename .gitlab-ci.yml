# SQE owns product inputs and checks; reusable controls live in Aikido.
# Routine MRs never build release binaries/images. Opt in with SQE_FORCE_IMAGE_BUILD=1.
# Tests, dependency gates and SAST remain blocking; publishing waits on test stage.
#
# SQE_CI_PROFILE sizes the Rust work. "minimal" = the test gate plus the cheap
# xtask guards; "full" adds clippy, the sqe-catalog feature matrix and the
# hakari drift check (ci/aikido-rust-extra.sh). MRs default to minimal so the
# shared runners carry one workspace compile per pipeline, not two. Opt in per
# MR with the `ci::full` label (then run a new pipeline) or the pipeline
# variable SQE_CI_PROFILE=full. Main and tags always run full.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($SQE_CI_PROFILE == "full" || $CI_MERGE_REQUEST_LABELS =~ /(^|,)ci::full(,|$)/)'
      variables:
        SQE_CI_PROFILE: "full"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        SQE_CI_PROFILE: "minimal"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_TAG'
      variables:
        SQE_CI_PROFILE: "full"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        SQE_CI_PROFILE: "full"

ci-config-sanity:
  variables:
    AIKIDO_SHARED_SCRIPTS: "check-advisory-ignores.py"
  extends: .aikido-shared-scripts
  stage: test
  image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
  script:
    - python -m json.tool renovate.json >/dev/null
    - apk add --no-cache make bash grep >/dev/null
    - python3 "$AIKIDO_SHARED_HOME/scripts/check-advisory-ignores.py"
    - make leak-scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

supply-chain-watch:
  extends: .aikido-supply-chain-watch

vuln-review:
  extends: .aikido-vuln-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SQE_SCHEDULE == "monthly-vuln-review"'

default:
  interruptible: true

include:
  - project: 'vpf-data-ai/aikido'
    ref: '3911cfb92ece401e9dcaf329c95a0a8363e1f23f'
    file: '/ci/templates/guardrails.yml'
  - project: 'vpf-data-ai/aikido'
    ref: '3911cfb92ece401e9dcaf329c95a0a8363e1f23f'
    file: '/ci/templates/test-rust.yml'
  - project: 'vpf-data-ai/aikido'
    ref: '3911cfb92ece401e9dcaf329c95a0a8363e1f23f'
    file: '/ci/templates/deploy.yml'
  - project: 'vpf-data-ai/aikido'
    ref: '3911cfb92ece401e9dcaf329c95a0a8363e1f23f'
    file: '/ci/templates/release.yml'
  - project: 'vpf-data-ai/aikido'
    ref: '3911cfb92ece401e9dcaf329c95a0a8363e1f23f'
    file: '/ci/templates/consumer-controls.yml'

variables:
  AIKIDO_SHARED_REF: "3911cfb92ece401e9dcaf329c95a0a8363e1f23f"
  AIKIDO_CARGO_SUPPLY_CHAIN_IN_TEST: "0"
  AIKIDO_DOCKERFILE: "Dockerfile.ci"
  AIKIDO_SCAN_BUILT_IMAGE_ONLY: "1"
  AIKIDO_SBOM_CARGO_LICENSES: "1"
  AIKIDO_SBOM_EXTRA_EXCLUDES: "**/quickstart/** **/docs/** **/adapters/** **/target/** **/.aikido-shared/**"
  AIKIDO_IMAGE_NAME: "sqlengine/sqe"
  AIKIDO_CARGO_GATE_ENFORCE: "1"
  AIKIDO_RUST_MIN_STACK: "33554432"
  AIKIDO_CARGO_CLIPPY_JOB: "1"
  AIKIDO_DOCKER_TARGET: "runtime"
  AIKIDO_SIGN: "1"
  AIKIDO_REPUTATION_MAX_AGE_DAYS: "7"
  AIKIDO_REPUTATION_MAX: "800"

release-binaries:
  extends: .aikido-rust-binaries
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SQE_FORCE_IMAGE_BUILD == "1"'
      variables:
        CARGO_PROFILE: "dev-release"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        CARGO_PROFILE: "release"
  variables:
    AIKIDO_RUST_BINARIES: "sqe-server sqe-cli sqe-bench"
    AIKIDO_RUST_BIN_FLAGS: "--bin sqe-server --bin sqe-cli --bin sqe-bench"

ci-deps-image:
  extends: .aikido-rust-deps-image
  variables:
    AIKIDO_DEPS_TARGET: "/opt/sqe-deps/target"

malware-scan:
  extends: .aikido-malware-scan
  rules: !reference [release-binaries, rules]
  needs:
    - job: release-binaries
      artifacts: true

deps-check:
  extends: .aikido-rust-deps-check
  variables:
    AIKIDO_CARGO_MACHETE_PATHS: "crates/sqe-*"
    AIKIDO_DEPS_EXTRA_SCRIPT: "scripts/check-test-layout.sh"

helm-chart-check:
  extends: .aikido-helm-check
  variables:
    AIKIDO_HELM_CHART: "deploy/helm/sqe"
    AIKIDO_HELM_RELEASE: "sqe"
    AIKIDO_HELM_VALUE_ARGS: "-f deploy/helm/sqe/values-production.yaml"
    AIKIDO_HELM_SETS: >-
      --set config.policy.ranger.url=http://ranger:6080
      --set existingSecret=placeholder
      --set workerSecret.existingSecret=placeholder
      --set worker.enabled=true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["deploy/helm/**/*", .gitlab-ci.yml]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

aikido-build:
  timeout: 30m
  dependencies: [release-binaries]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists: [Dockerfile.ci]

aikido-build-validate:
  needs:
    - job: release-binaries
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SQE_FORCE_IMAGE_BUILD == "1"'

# `:latest` on Harbor = the newest release. aikido-publish-release-image
# mirrors only `:vX.Y.Z` + `:stable`, and only to chameleon/sqlengine/sqe
# (deploy_mirror.py applies one AIKIDO_IMAGE_NAME to every registry), so this
# adds `:latest` there and keeps chameleon/sqe (the `make push` repo) on the
# same release. Fail-closed like the release mirror. amd64 only: the CI
# image is single-arch; multi-arch still needs a local `make push`.
sqe-publish-latest:
  interruptible: false
  stage: .post
  image: "$AIKIDO_TOOLS_IMAGE"
  needs:
    - job: aikido-publish-release-image
  variables:
    HARBOR: "repo.sovereign-data.org/chameleon"
  script:
    - |
      set -eu
      SRC="docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      for DEST in sqlengine/sqe:latest sqe:$CI_COMMIT_TAG sqe:stable sqe:latest; do
        skopeo copy --src-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
          --dest-creds "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
          "$SRC" "docker://$HARBOR/$DEST"
        echo "mirrored -> $HARBOR/$DEST"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      exists:
        - Dockerfile

# Scheduled rescan of the deployed release; main uses the digest gate.
aikido-image-scan:
  variables:
    AIKIDO_IMAGE: "$CI_REGISTRY_IMAGE:stable"

aikido-sbom:
  variables:
    AIKIDO_SHARED_SCRIPTS: "sbom-license-from-cargo.py"
    # playground/ is outside the cargo workspace (wasm32-only, own Cargo.lock),
    # so its manifest is not in the script's default globs.
    AIKIDO_SBOM_LICENSE_MANIFESTS: "playground/Cargo.toml"
  before_script:
    - !reference [.aikido-shared-scripts, before_script]

# Refresh these reviewed digests when the dependency image is rebuilt. The
# moving main tag is build output, not a trusted immutable test environment.
aikido-test-rust:
  image: "registry-sbp.gitlab.schubergphilis.com/vpf-data-ai/chameleon/applications/sqlengine/ci-deps:main@sha256:ca76cfbb51768ed5ba75482893d159fa0773da5f9c97f5e9344dc1a4fb4a1c66"
  variables:
    AIKIDO_SHARED_SCRIPTS: "reuse-deps-image.sh"
    CARGO_TARGET_DIR: "/opt/sqe-deps/target"
  cache: []
  before_script:
    - !reference [.aikido-shared-scripts, before_script]
    - bash "$AIKIDO_SHARED_HOME/scripts/reuse-deps-image.sh"
    - !reference [.aikido_rust_build_env, before_script]

aikido-rust-extra:
  image: "registry-sbp.gitlab.schubergphilis.com/vpf-data-ai/chameleon/applications/sqlengine/ci-deps:main@sha256:ca76cfbb51768ed5ba75482893d159fa0773da5f9c97f5e9344dc1a4fb4a1c66"
  variables:
    AIKIDO_SHARED_SCRIPTS: "reuse-deps-image.sh"
    CARGO_TARGET_DIR: "/opt/sqe-deps/target"
  cache: []
  before_script:
    - !reference [.aikido-shared-scripts, before_script]
    - bash "$AIKIDO_SHARED_HOME/scripts/reuse-deps-image.sh"
    - !reference [.aikido_rust_build_env, before_script]

aikido-clippy-rust:
  rules:
    - when: never

# Live round trips against the catalogs outside the Iceberg matrix rubric that
# SQE still advertises (#866): Nessie (Iceberg REST), Hive Metastore (Thrift)
# and JDBC on PostgreSQL. They were #[ignore] tests run by hand, so a
# regression waited for the next manual run. Extends aikido-rust-extra for the
# deps image, its warm target dir and the build env. GitLab `services:`
# sidecars, not docker-in-docker. Images are pinned by digest; the tags match
# docker-compose.{test,nessie,hms}.yml, which run the same tests locally. The
# tests only create and drop namespaces, so Nessie needs no S3 service.
catalog-live-tests:
  extends: aikido-rust-extra
  services:
    - name: "postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb"
      alias: postgres
      variables:
        POSTGRES_USER: iceberg
        POSTGRES_PASSWORD: iceberg
        POSTGRES_DB: iceberg_catalog
    - name: "ghcr.io/projectnessie/nessie:0.108.3@sha256:219709df809fcfac7abe0491b2070c8d56178ed29828fb30968a4365b62bcc8a"
      alias: nessie
      variables:
        NESSIE_VERSION_STORE_TYPE: IN_MEMORY
        QUARKUS_HTTP_PORT: "19120"
        NESSIE_CATALOG_DEFAULT_WAREHOUSE: warehouse
        NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: "s3://warehouse/"
    - name: "apache/hive:standalone-metastore-4.1.0@sha256:cc898f60aff301a5b8811b9fcd7631822ffde82180f0d47ef1c24e287e4a9845"
      alias: hive-metastore
      variables:
        SERVICE_NAME: metastore
        DB_DRIVER: derby
        SERVICE_OPTS: "-Dmetastore.warehouse.dir=file:///opt/hive/warehouse"
  variables:
    SQE_TEST_PG_URL: "postgres://iceberg:iceberg@postgres:5432/iceberg_catalog"
    SQE_TEST_NESSIE_URI: "http://nessie:19120/iceberg/"
    SQE_TEST_HMS_URI: "hive-metastore:9083"
  script:
    - |
      set -euo pipefail
      # The runner stops waiting on a service after 30s and starts the job
      # anyway; HMS runs schematool first and takes about a minute. Wait on
      # every port, bounded, rather than fail the first test.
      bash -c '
        for hp in postgres:5432 nessie:19120 hive-metastore:9083; do
          host=${hp%:*}; port=${hp#*:}
          for i in $(seq 1 180); do
            if (exec 3<>"/dev/tcp/$host/$port") 2>/dev/null; then
              echo "$hp up after ${i}s"; break
            fi
            if [ "$i" = 180 ]; then echo "$hp not up after 180s"; exit 1; fi
            sleep 1
          done
        done'
      cargo test -p sqe-catalog --features hms,sql-postgres --test it -- \
        --ignored nessie:: hms:: sql_postgres::
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "crates/sqe-catalog/**/*"
        - "vendor/iceberg-rust/**/*"
        - "Cargo.lock"
        - ".gitlab-ci.yml"
        - "docker-compose.nessie.yml"
        - "docker-compose.hms.yml"

vendored-profile-drift:
  stage: test
  image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  variables:
    GIT_DEPTH: "1"
    DATA_PLATFORM_DIR: "$CI_BUILDS_DIR/data-platform"
  before_script:
    - apk add --no-cache git bash diffutils >/dev/null
  script:
    - |
      set -euo pipefail
      if ! git clone --depth 1           "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/vpf-data-ai/chameleon/applications/data-platform.git"           "$DATA_PLATFORM_DIR" 2>/dev/null; then
        echo "could not clone data-platform with CI_JOB_TOKEN." >&2
        echo "Add this project to data-platform's CI/CD job token allowlist" >&2
        echo "(Settings > CI/CD > Job token permissions), or run" >&2
        echo "scripts/check-vendored-profile.sh locally before merging." >&2
        echo "NOT passing: the vendored profile may be stale." >&2
        exit 1
      fi
      bash scripts/check-vendored-profile.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "crates/sqe-policy/assets/*.json"
        - "crates/sqe-policy/src/grants/profile.rs"
        - "scripts/check-vendored-profile.sh"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "crates/sqe-policy/assets/*.json"

aikido-sast:
  allow_failure: false

gitlab-release:
  extends: .aikido-gitlab-release
