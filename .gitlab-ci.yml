# sqlengine CI — migrated to the aikido platform (vpf-data-ai/aikido).
# Security guardrails, rust test (+ ci/aikido-rust-extra.sh for feature matrix &
# xtask), build->Harbor + image SBOM, semver release + cosign signing come from
# aikido includes. The docker-compose integration suites below stay repo-specific,
# hosted in the aikido-orchestrated pipeline. Perf benchmark dropped.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# HARBOR RELEASE MIRRORING: the `ref:` below must be an aikido release that
# contains aikido-publish-release-image (vpf-data-ai/aikido!126). v0.9.5 does
# NOT. Without that job a vX.Y.Z tag pipeline pushes :vX.Y.Z + :stable to the
# GitLab registry and mirrors NEITHER to Harbor, which is why
# repo.sovereign-data.org/chameleon/sqlengine/sqe:stable has been v0.37.0 since
# 2026-06-24 while main moved 1110 commits. Renovate bumps this automatically;
# do not merge the release MR until it has.
include:
  - project: 'vpf-data-ai/aikido'
    ref: 'v0.9.5'
    file: '/ci/templates/guardrails.yml'
  - project: 'vpf-data-ai/aikido'
    ref: 'v0.9.5'
    file: '/ci/templates/test-rust.yml'
  - project: 'vpf-data-ai/aikido'
    ref: 'v0.9.5'
    file: '/ci/templates/deploy.yml'
  - project: 'vpf-data-ai/aikido'
    ref: 'v0.9.5'
    file: '/ci/templates/release.yml'
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  AIKIDO_IMAGE_NAME: "sqlengine/sqe"
  # Live policy/scripts until aikido-tools image is rebuilt with CDLA + r-efi
  # exception + SQE reviewed_evidence (aikido!51). After tools image digest
  # updates, this override can be removed and AIKIDO_HOME from the image used.
  AIKIDO_POLICY_REF: "v0.9.0"
  # Final stage of the multi-stage Dockerfile (distroless/cc:nonroot runtime).
  # Passed as --target to kaniko so we never accidentally ship an intermediate
  # builder stage if stage order in Dockerfile drifts.
  AIKIDO_DOCKER_TARGET: "runtime"

# Cold Rust image build. The Dockerfile is a plain multi-stage (rust bookworm
# builder -> distroless runtime) with no chef/sccache; a full release link of
# the engine can still exceed GitLab's 1h default. This is a CEILING only.
#
# Script is re-stated from aikido deploy.yml (v0.9.4) so we can pass
# --target=$AIKIDO_DOCKER_TARGET. When bumping the aikido `ref:`, re-diff this
# script against ci/templates/deploy.yml and keep the --target line.
aikido-build:
  timeout: 3h
  script:
    - |
      set -euo pipefail
      # Standard provenance build-args (Dockerfiles that don't declare them just
      # ignore the values); repos add more via AIKIDO_BUILD_ARGS="K=V K2=V2".
      BA="--build-arg VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      BA="$BA --build-arg BUILD_DATE=$CI_PIPELINE_CREATED_AT --build-arg GIT_REVISION=$CI_COMMIT_SHA"
      # kaniko doesn't auto-populate BuildKit's TARGETARCH/TARGETOS; default amd64.
      BA="$BA --build-arg TARGETARCH=${AIKIDO_TARGETARCH:-amd64} --build-arg TARGETOS=linux"
      for kv in ${AIKIDO_BUILD_ARGS:-}; do BA="$BA --build-arg $kv"; done
      # Distroless final stage (Dockerfile `AS runtime`).
      TARGET="--target ${AIKIDO_DOCKER_TARGET:-runtime}"
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        DEST="--destination $AIKIDO_IMAGE --digest-file image-digest.txt"
      else
        DEST="--no-push"
      fi
      echo "kaniko: target=${AIKIDO_DOCKER_TARGET:-runtime} dest_mode=$( [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ] && echo push || echo no-push )"
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        $TARGET \
        $BA \
        $DEST
      [ -f image-digest.txt ] || echo "validation-only build (--no-push); no image pushed" > image-digest.txt

# Container CVE gate on the image kaniko just built. Source-tree grype (aikido-scan)
# never sees the distroless base or the static healthcheck wget; this job does.
# Distroless/cc is expected to keep HIGH/CRITICAL at zero (measured ~0 high when
# the runtime landed). MR validation builds do not push, so the gate is a no-op
# there and enforces on merge when the image is in the GitLab registry.
aikido-image-vuln:
  stage: .post
  image: "$AIKIDO_TOOLS_IMAGE"
  needs:
    - job: aikido-build
      artifacts: true
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
  script:
    - |
      set -euo pipefail
      if grep -q 'validation-only' image-digest.txt 2>/dev/null; then
        echo "MR validation build (no image pushed); container CVE gate runs on merge to $CI_DEFAULT_BRANCH"
        exit 0
      fi
      echo "grype container gate: registry:$AIKIDO_IMAGE (fail-on high)"
      grype "registry:$AIKIDO_IMAGE" -o table --fail-on high
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists:
        - Dockerfile
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists:
        - Dockerfile

# Exclude demo/quickstart Python trees from the source SBOM so commercial
# EULA packages (dlthub) and docs samples are not license-gated as product deps.
# Also keep syft focused on the engine workspace.
#
# The third step supplies licenses for the crates that live in THIS repo. syft's
# Rust cataloger reads Cargo.lock, which carries no license, so every crate comes
# out without one; `sbom_license_check.py` then recovers them from deps.dev, which
# works for anything on crates.io and cannot work for a workspace member or a
# vendored fork. That left 29 components in REVIEW with "license evidence
# missing", and under --strict that fails the gate and skips every build and
# publish job behind it.
#
# All 29 declare their license in their own Cargo.toml (28 Apache-2.0, jiter MIT).
# This is not a waiver, it is the missing transport: the script only fills a
# component whose name AND version match a crate on disk, reads the value from
# that crate's manifest, and records CycloneDX evidence naming the file. Its
# --selftest asserts the narrowness rules, so run it first.
aikido-sbom:
  script:
    - |
      set -euo pipefail
      syft "dir:$CI_PROJECT_DIR" \
        --source-name "$CI_PROJECT_NAME" \
        --source-version "$CI_COMMIT_SHORT_SHA" \
        --exclude '**/quickstart/**' \
        --exclude '**/docs/**' \
        --exclude '**/adapters/**' \
        --exclude '**/target/**' \
        -o "cyclonedx-json@1.6=$AIKIDO_SBOM"
      python3 "$AIKIDO_HOME/scripts/sbom_enrich.py" --sbom "$AIKIDO_SBOM" --asset "$CI_PROJECT_DIR/.asset"
      python3 "$CI_PROJECT_DIR/ci/sbom-license-from-cargo.py" --selftest
      python3 "$CI_PROJECT_DIR/ci/sbom-license-from-cargo.py" \
        --sbom "$AIKIDO_SBOM" --root "$CI_PROJECT_DIR"

# ===== blocking correctness gate (#386) =====
# The shared `aikido-test-rust` job already runs `cargo test --all`, but it is
# `allow_failure: true` (advisory by design, so verify never blocks the security
# guardrails) and its rules skip it unless Rust files changed. Advisory is the
# wrong mode for these two checks: every way `main` broke in the 2026-07-27/28
# window went in through a pipeline where nothing blocked.
#
#   - reqwest 0.13 bumped in Cargo.toml without regenerating Cargo.lock, so the
#     workspace did not resolve at all (`--locked` catches this in seconds).
#   - jsonwebtoken 11 merged with no crypto provider feature selected, so every
#     JWT verification panicked at runtime. It COMPILED cleanly -- only running
#     the tests catches it, which is why this gate runs `test`, not `check`.
#   - two merges duplicated unit tests, breaking only the test build.
#
# Deliberately narrow and blocking: manifest/lock consistency, then behaviour.
# Everything advisory (clippy, audit, deny) stays in aikido-test-rust.
cargo-gate:
  stage: test
  # rustup in the image honours rust-toolchain.toml, so the pinned toolchain is
  # used rather than whatever the base image ships. Keeps the gate honest if the
  # pin moves.
  image: rust:slim
  variables:
    # Deep async state machines in the scan path overflow the default 2MB test
    # thread stack (see docs: write e2e tests need this too).
    RUST_MIN_STACK: "33554432"
    CARGO_TERM_COLOR: "always"
  cache:
    key: "cargo-gate-$CI_COMMIT_REF_SLUG"
    paths: ["target/", ".cargo/registry/"]
  before_script:
    - |
      set -euo pipefail
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends \
        clang mold cmake protobuf-compiler libssl-dev pkg-config >/dev/null
  script:
    - |
      set -euo pipefail
      # 1. Manifest and lockfile must agree. Fails in seconds on the renovate
      #    "bumped Cargo.toml, never regenerated Cargo.lock" pattern.
      echo "== cargo metadata --locked =="
      cargo metadata --locked --format-version 1 > /dev/null
      # 2. Behaviour. `cargo check` is NOT sufficient: the jsonwebtoken crypto
      #    provider is resolved at runtime, so a tree with panicking auth
      #    type-checks perfectly.
      echo "== cargo test --workspace =="
      cargo test --workspace --all-features
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["**/*.rs", "**/Cargo.toml", "**/Cargo.lock", "rust-toolchain.toml"]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# The vendored grant profile must be the platform's current one.
#
# crates/sqe-policy's golden-fixture tests prove SQE's planner agrees with the
# profile it HOLDS. They cannot notice that the profile it holds is stale, and SQE
# and the control plane write Ranger policies to the SAME `polaris` service -- so a
# stale copy means the same GRANT confers different access depending on which tool
# issued it. This job is the other half.
#
# Deliberately NOT allow_failure. The script exits 2 (distinct from 1) when it
# cannot find the platform checkout, precisely so a job that cannot verify fails
# instead of reporting success: a silently-skipped drift gate is indistinguishable
# from a clean one, which is the failure this exists to prevent.
#
# Scoped by `changes` so it only runs when the vendored assets or the checker move,
# rather than gating every MR on the availability of another repository.
vendored-profile-drift:
  stage: test
  image: alpine:3.24
  variables:
    GIT_DEPTH: "1"
    DATA_PLATFORM_DIR: "$CI_BUILDS_DIR/data-platform"
  before_script:
    - apk add --no-cache git bash diffutils >/dev/null
  script:
    - |
      set -euo pipefail
      # CI_JOB_TOKEN can read sibling projects when the platform project allows
      # this one in its CI/CD job-token allowlist. If it cannot, the clone fails
      # here and the job fails loudly rather than skipping the check.
      if ! git clone --depth 1           "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/vpf-data-ai/chameleon/applications/data-platform.git"           "$DATA_PLATFORM_DIR" 2>/dev/null; then
        echo "could not clone data-platform with CI_JOB_TOKEN." >&2
        echo "Add this project to data-platform's CI/CD job token allowlist" >&2
        echo "(Settings > CI/CD > Job token permissions), or run" >&2
        echo "scripts/check-vendored-profile.sh locally before merging." >&2
        echo "NOT passing: the vendored profile may be stale." >&2
        exit 1
      fi
      bash scripts/check-vendored-profile.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "crates/sqe-policy/assets/*.json"
        - "crates/sqe-policy/src/grants/profile.rs"
        - "scripts/check-vendored-profile.sh"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "crates/sqe-policy/assets/*.json"

# ===== repo-specific integration suites (docker-in-docker), hosted here =====
integration-test:
  stage: test
  image: docker:29
  # docker-in-docker. The job's `docker compose up` against
  # docker-compose.test.yml needs a real Docker daemon, which the sibling
  # `docker:24-dind` service provides. Explicit `alias: docker` ensures the
  # DNS name the job container connects to (`tcp://docker:2375`) lines up
  # with the service hostname regardless of GitLab Runner version, and
  # `--tls=false --host=tcp://0.0.0.0:2375` makes dind listen on the
  # non-TLS port instead of the default TLS-only :2376. Without the
  # explicit command the daemon binds to 2376 with self-signed certs and
  # the job hits `Cannot connect to the Docker daemon at tcp://docker:2375`.
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    # `clang` + `mold` mirror the rust:bookworm jobs above: .cargo/config.toml
    # pins them as the Linux linker, so the Alpine-based integration job must
    # install them as well. `mold` lives in the community repo (on by default
    # in docker:24's apk index).
    - apk add --no-cache bash curl docker-compose rust cargo cmake protobuf-dev openssl-dev pkgconfig clang mold
    # Wait for dind (issue #387). Failures still surface as a yellow job while
    # allow_failure is set; do not hang forever.
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "waiting for docker daemon ($i/30)..."
        sleep 2
      done
      docker info
  script:
    - ./scripts/integration-test.sh
  # allow_failure on every rule: runner dind is still flaky (#387). Keep the
  # job so a healthy runner still exercises the stack; do not paint main red.
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  timeout: 1h

# ── Distributed smoke (Q-05) ───────────────────────────────────
# Runs the distributed dispatch test (test_distributed_select) against
# the coordinator + 2 workers stack. Uses the same dind + Alpine setup
# as integration-test but overlays docker-compose.distributed.yml and
# sets DISTRIBUTED=1 so the integration script brings up workers and
# does not skip the distributed test. This ensures worker dispatch and
# system.runtime.tasks visibility do not regress.
distributed-smoke:
  stage: test
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DISTRIBUTED: "1"
  before_script:
    - apk add --no-cache bash curl docker-compose rust cargo cmake protobuf-dev openssl-dev pkgconfig clang mold
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "waiting for docker daemon ($i/30)..."
        sleep 2
      done
      docker info
  script:
    - ./scripts/integration-test.sh test_distributed_select
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  timeout: 1h

# ── Quickstart scenario tests (Tier 2) ─────────────────────────
# Tier 2 of scripts/test.sh: runs every SELF_CONTAINED quickstart through its
# run.sh --check. Each scenario brings up its own docker-compose stack (Polaris,
# Nessie, Unity, etc.) and asserts the demo invariants with the shared
# _shared/lib.sh helpers. Mirrors the integration-test docker-in-docker setup:
# same image, same dind service, same Alpine toolchain install. The heavy
# `distributed` scenario is deliberately NOT in the self-contained set, so it
# does not run here; invoke it on demand with `scripts/test.sh scenario
# distributed`. Generous timeout: each scenario builds or pulls images.
scenario-test:
  stage: test
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    # Same Alpine toolchain as integration-test: the embedded-* scenarios build
    # sqe-cli, and several scenarios drive the stack with bash/curl/python3.
    - apk add --no-cache bash curl docker-compose rust cargo cmake protobuf-dev openssl-dev pkgconfig clang mold python3
  script:
    - ./scripts/test.sh scenario all
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Path-matching MR pipelines: opt-in (manual) and non-blocking, like
    # integration-test. `scenario all` builds several SQE images, so a touched
    # quickstart file must not silently spend the better part of an hour.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - quickstart/**/*
        - crates/**/*
        - scripts/test.sh
        - docker-compose*.yml
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - quickstart/**/*
        - crates/**/*
        - scripts/test.sh
        - docker-compose*.yml
  timeout: 2h

# ── Access-control e2e (Polaris + Ranger + Keycloak) ───────────
# The Rust access-control suite (crates/sqe-coordinator/tests/it/
# access_control_e2e.rs) against the polaris-ranger-keycloak quickstart stack:
# grant/revoke, Ranger deny precedence, column masks, keyed hash masks, row
# filters, tag-based masks and tag fail-closed. Same docker-in-docker setup as
# scenario-test, plus a Rust toolchain because the tests ARE a cargo test binary.
#
# NOTE ON SIGNAL: while the shared dind runner is unhealthy this job cannot fail
# meaningfully, so a green pipeline here is not evidence. Gate policy changes on
# a local `make test-access-control` until dind is trustworthy again.
access-control-test:
  stage: test
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    # Ranger Admin's first boot is 2-4 minutes locally; the script polls with
    # this deadline before giving up and reporting the last HTTP status. The
    # deadline covers readiness polling only, NOT the image pulls that precede
    # it, so a cold dind runner spends its pull time against the job's 1h
    # timeout rather than this one. Raise both together if pulls dominate.
    AC_RANGER_TIMEOUT: "600"
  before_script:
    - apk add --no-cache bash curl docker-compose rust cargo cmake protobuf-dev openssl-dev pkgconfig clang mold python3
  script:
    - ./scripts/access-control-test.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - crates/sqe-policy/**/*
        - crates/sqe-coordinator/src/policy_wiring.rs
        - crates/sqe-coordinator/tests/it/access_control_e2e.rs
        - crates/sqe-coordinator/tests/it/common/**/*
        - quickstart/polaris-ranger-keycloak/**/*
        - scripts/access-control-test.sh
        - tests/sqe-ranger-test.toml
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - crates/sqe-policy/**/*
        - crates/sqe-coordinator/src/policy_wiring.rs
        - crates/sqe-coordinator/tests/it/access_control_e2e.rs
        - crates/sqe-coordinator/tests/it/common/**/*
        - quickstart/polaris-ranger-keycloak/**/*
        - scripts/access-control-test.sh
        - tests/sqe-ranger-test.toml
  timeout: 1h

# ── AWS cloud-backed scenario tests (opt-in, needs AWS creds) ──
# Runs the AWS quickstarts (aws-glue, aws-s3-tables, glue-lake-formation) end to
# end: each run.sh CDK-deploys throwaway Glue / S3 Tables / Lake Formation
# resources, drives a create/write/read round-trip through SQE, then tears the
# resources back down. These cost real money and touch a real AWS account, so
# the job is `when: manual` only and never runs automatically.
#
# Prerequisites (set as protected/masked CI/CD variables before triggering):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION (and AWS_SESSION_TOKEN
#   for assumed-role creds). The target account must be `cdk bootstrap`-ed once.
# RUN_AWS_SCENARIOS gates the body so an accidental trigger without creds is a
# clear no-op rather than a half-deployed stack.
#
# The AWS run.sh scripts support `--check`: each runs its deploy -> round-trip
# flow, asserts the OUTPUT-derived invariants, and tears the resources back down
# (the assertions run before teardown, so a failed assertion still cleans up the
# stack). This job invokes them with `--check` so the gated run actually asserts.
scenario-test-aws:
  stage: test
  image: docker:29
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    # Opt-in switch. The job is manual; this guards the body too.
    RUN_AWS_SCENARIOS: "1"
  before_script:
    # AWS scenarios need the AWS CLI, Node/npx (CDK), and Docker, plus bash.
    # NOTE: run.sh uses `aws configure export-credentials` (AWS CLI v2 only).
    # Alpine's `aws-cli` apk package is v1 and lacks that subcommand, so a real
    # runner for this job must provide AWS CLI v2 (custom image or v2 install
    # step). Wiring AWS CLI v2 into a real runner image is the remaining piece;
    # this is a skeleton.
    - apk add --no-cache bash curl docker-compose aws-cli nodejs npm python3
  script:
    - |
      if [ "${RUN_AWS_SCENARIOS:-0}" != "1" ]; then
        echo "RUN_AWS_SCENARIOS != 1; skipping AWS scenarios (set the variable to opt in)."
        exit 0
      fi
    # Fail fast with a clear message if the AWS credentials are not wired.
    - 'test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "ERROR: AWS_ACCESS_KEY_ID not set. Configure AWS_* CI/CD variables before triggering this job."; exit 1; }'
    - ( cd quickstart/aws-glue && ./run.sh --check )
    - ( cd quickstart/aws-s3-tables && ./run.sh --check )
    - ( cd quickstart/glue-lake-formation && ./run.sh --check )
  rules:
    - when: manual
      allow_failure: true
  timeout: 2h

# ── Iceberg matrix score regression guard ─────────────────────
# Runs `cargo xtask matrix-report --min-percent N` where N is the current
# baseline. If the committed docs/iceberg-matrix-state.json drops below the
# baseline, the job fails. Bump MATRIX_MIN_PERCENT when a phase lands.
