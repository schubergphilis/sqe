# SQE owns product inputs and checks; reusable controls live in Aikido.
# Routine MRs never build release binaries/images. Opt in with SQE_FORCE_IMAGE_BUILD=1.
# Tests, dependency gates and SAST remain blocking on the MR.
#
# Main runs no test or lint jobs: the MR pipeline already ran them on the same
# tree, and repeating them after every merge (test suite, clippy matrix, catalog
# live tests: ~1 h of runner CPU, every merge cancelling the last) starved the
# shared runner. Main keeps the security/supply-chain guardrails (.pre), the
# advisory feed (deps-check) and a MANUAL release build: press play on
# release-binaries, or run a main pipeline with SQE_BUILD_IMAGE=1, to build
# and publish the :main image. Release tags build their own image
# (aikido-release-image), so a release never waits on main's build.
#
# SQE_CI_PROFILE sizes the Rust work. "minimal" = the test gate plus the cheap
# xtask guards; "full" adds clippy, the sqe-catalog feature matrix and the
# hakari drift check (ci/aikido-rust-extra.sh). MRs default to minimal so the
# shared runners carry one workspace compile per pipeline, not two. Opt in per
# MR with the `ci::full` label (then run a new pipeline) or the pipeline
# variable SQE_CI_PROFILE=full. Tags run full.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($SQE_CI_PROFILE == "full" || $CI_MERGE_REQUEST_LABELS =~ /(^|,)ci::full(,|$)/)'
      variables:
        SQE_CI_PROFILE: "full"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        SQE_CI_PROFILE: "minimal"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_COMMIT_TAG'
      variables:
        SQE_CI_PROFILE: "full"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        SQE_CI_PROFILE: "full"

ci-config-sanity:
  variables:
    AIKIDO_SHARED_SCRIPTS: "check-advisory-ignores.py"
  extends: .aikido-shared-scripts
  stage: test
  image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
  script:
    - python -m json.tool renovate.json >/dev/null
    - apk add --no-cache make bash grep >/dev/null
    - python3 "$AIKIDO_SHARED_HOME/scripts/check-advisory-ignores.py"
    - make leak-scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

supply-chain-watch:
  extends: .aikido-supply-chain-watch

vuln-review:
  extends: .aikido-vuln-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SQE_SCHEDULE == "monthly-vuln-review"'

default:
  interruptible: true

include:
  - project: '$CI_PROJECT_ROOT_NAMESPACE/aikido'
    ref: 'af7e72c4424b52618c091e47d438bfea8e772e55'
    file: '/ci/templates/guardrails.yml'
  - project: '$CI_PROJECT_ROOT_NAMESPACE/aikido'
    ref: 'af7e72c4424b52618c091e47d438bfea8e772e55'
    file: '/ci/templates/test-rust.yml'
  - project: '$CI_PROJECT_ROOT_NAMESPACE/aikido'
    ref: 'af7e72c4424b52618c091e47d438bfea8e772e55'
    file: '/ci/templates/deploy.yml'
  - project: '$CI_PROJECT_ROOT_NAMESPACE/aikido'
    ref: 'af7e72c4424b52618c091e47d438bfea8e772e55'
    file: '/ci/templates/release.yml'
  - project: '$CI_PROJECT_ROOT_NAMESPACE/aikido'
    ref: 'af7e72c4424b52618c091e47d438bfea8e772e55'
    file: '/ci/templates/consumer-controls.yml'

variables:
  AIKIDO_SHARED_REF: "af7e72c4424b52618c091e47d438bfea8e772e55"
  AIKIDO_CARGO_SUPPLY_CHAIN_IN_TEST: "0"
  AIKIDO_DOCKERFILE: "Dockerfile.ci"
  AIKIDO_SCAN_BUILT_IMAGE_ONLY: "1"
  AIKIDO_SBOM_CARGO_LICENSES: "1"
  AIKIDO_SBOM_EXTRA_EXCLUDES: "**/quickstart/** **/docs/** **/adapters/** **/target/** **/.aikido-shared/**"
  AIKIDO_IMAGE_NAME: "sqlengine/sqe"
  AIKIDO_CARGO_GATE_ENFORCE: "1"
  AIKIDO_RUST_MIN_STACK: "33554432"
  AIKIDO_CARGO_CLIPPY_JOB: "1"
  AIKIDO_DOCKER_TARGET: "runtime"
  # Off until signing uses a key (release.md, "Release images are not signed
  # yet"): keyless cosign against public Sigstore rejects this GitLab's ID token.
  AIKIDO_SIGN: "0"
  AIKIDO_REPUTATION_MAX_AGE_DAYS: "7"
  AIKIDO_REPUTATION_MAX: "800"

release-binaries:
  extends: .aikido-rust-binaries
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SQE_FORCE_IMAGE_BUILD == "1"'
      variables:
        CARGO_PROFILE: "dev-release"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SQE_BUILD_IMAGE == "1"'
      variables:
        CARGO_PROFILE: "release"
    # On demand: ~30-50 min of release-profile compile per merge was the
    # largest single cost on the runner. allow_failure keeps the pipeline
    # green (not "blocked") while nobody presses play.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
      variables:
        CARGO_PROFILE: "release"
  variables:
    AIKIDO_RUST_BINARIES: "sqe-server sqe-cli sqe-bench"
    AIKIDO_RUST_BIN_FLAGS: "--bin sqe-server --bin sqe-cli --bin sqe-bench"

ci-deps-image:
  extends: .aikido-rust-deps-image
  variables:
    AIKIDO_DEPS_TARGET: "/opt/sqe-deps/target"

# Runs whenever release-binaries ran (its `needs:` holds it until then); not
# manual itself, so one press builds, scans and publishes.
malware-scan:
  extends: .aikido-malware-scan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SQE_FORCE_IMAGE_BUILD == "1"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - job: release-binaries
      artifacts: true

deps-check:
  extends: .aikido-rust-deps-check
  variables:
    AIKIDO_CARGO_MACHETE_PATHS: "crates/sqe-*"
    AIKIDO_DEPS_EXTRA_SCRIPT: "scripts/check-test-layout.sh"

helm-chart-check:
  extends: .aikido-helm-check
  variables:
    AIKIDO_HELM_CHART: "deploy/helm/sqe"
    AIKIDO_HELM_RELEASE: "sqe"
    AIKIDO_HELM_VALUE_ARGS: "-f deploy/helm/sqe/values-production.yaml"
    AIKIDO_HELM_SETS: >-
      --set config.policy.ranger.url=http://ranger:6080
      --set existingSecret=placeholder
      --set workerSecret.existingSecret=placeholder
      --set worker.enabled=true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: ["deploy/helm/**/*", .gitlab-ci.yml]

# `needs:` instead of the template's stage ordering: with no test job on main
# there is no gate to wait for, and the build must wait for the manual
# release-binaries rather than start in .post without its artifacts.
aikido-build:
  timeout: 30m
  needs:
    - job: release-binaries
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      exists: [Dockerfile.ci]

aikido-build-validate:
  needs:
    - job: release-binaries
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $SQE_FORCE_IMAGE_BUILD == "1"'

# ── Multi-arch release image (#898) ─────────────────────────────────────────
# A `vX.Y.Z` tag publishes ONE manifest list for linux/amd64 and linux/arm64:
#
#   sqe-release-binaries     cargo zigbuild per arch on the amd64 runner
#                            (glibc 2.28 floor, no QEMU), as `make latest` does
#   sqe-release-image-arch   kaniko packages Dockerfile.ci per arch
#                            (--custom-platform; the file is COPY-only)
#   aikido-release-image     joins both into the index, tags :vX.Y.Z + :stable,
#                            fails unless both platforms are listed, and writes
#                            the index digest to image-digest.txt
#   aikido-release-image-scan + sqe-release-image-scan-arm64
#                            grype each platform of that digest
#   aikido-publish-release-image + sqe-publish-latest
#                            skopeo copy --all --preserve-digests to Harbor,
#                            then read back: both platforms, same digest
#   gitlab-release           release notes name the index digest
#
# The job names aikido-release-image and aikido-publish-release-image stay, so
# the template's scan and signing jobs keep their `needs:`. No Docker daemon on
# the runners, so no buildx: crane builds the index (scripts/ci-release-index.sh).
#
# Dry run on an MR: the `ci::multiarch` label (then run a new MR pipeline)
# builds both architectures with dev-release and pushes them to this project's
# registry as :mr-<iid> only. It never writes a release tag, :stable or Harbor:
# the scan, mirror and release jobs are tag-only.
.sqe_multiarch_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      exists:
        - Dockerfile
      variables:
        CARGO_PROFILE: "release"
        SQE_IMAGE_REF: "$CI_COMMIT_TAG"
        SQE_IMAGE_TAGS: "$CI_COMMIT_TAG stable"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)ci::multiarch(,|$)/'
      variables:
        CARGO_PROFILE: "dev-release"
        SQE_IMAGE_REF: "mr-$CI_MERGE_REQUEST_IID"
        SQE_IMAGE_TAGS: "mr-$CI_MERGE_REQUEST_IID"

sqe-release-binaries:
  rules: !reference [.sqe_multiarch_rules, rules]
  interruptible: false
  stage: test
  needs: []
  image: "$AIKIDO_RUST_IMAGE"
  timeout: 90m
  parallel:
    matrix:
      - SQE_ARCH: [amd64, arm64]
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
    CARGO_INCREMENTAL: "0"
    CARGO_TERM_COLOR: "always"
  cache:
    key: "release-binaries-registry"
    paths:
      - .cargo-home/registry/
  before_script:
    - !reference [.aikido_rust_build_env, before_script]
  script:
    - bash scripts/ci-release-binaries.sh "$SQE_ARCH"
  artifacts:
    paths:
      - dist/$SQE_ARCH/
    expire_in: 7 days

sqe-release-image-arch:
  rules: !reference [.sqe_multiarch_rules, rules]
  interruptible: false
  stage: test
  image:
    name: "gcr.io/kaniko-project/executor:v1.23.2-debug@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e"
    entrypoint: [""]
  parallel:
    matrix:
      - SQE_ARCH: [amd64, arm64]
  needs:
    - job: sqe-release-binaries
      artifacts: true
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
  script:
    # One platform per run; the index job checks that the config says it.
    - |
      set -eu
      CTX="$CI_PROJECT_DIR/dist/$SQE_ARCH"
      cp "$CI_PROJECT_DIR/Dockerfile.ci" "$CTX/Dockerfile"
      /kaniko/executor --context "$CTX" --dockerfile "$CTX/Dockerfile" --target runtime \
        --custom-platform "linux/$SQE_ARCH" \
        --build-arg "VERSION=$SQE_IMAGE_REF" --build-arg "BUILD_DATE=$CI_PIPELINE_CREATED_AT" \
        --build-arg "GIT_REVISION=$CI_COMMIT_SHA" \
        --destination "$CI_REGISTRY_IMAGE:$SQE_IMAGE_REF-$SQE_ARCH" \
        --digest-file "image-digest-$SQE_ARCH.txt"
      echo "linux/$SQE_ARCH $(cat "image-digest-$SQE_ARCH.txt")"
  artifacts:
    paths:
      - image-digest-$SQE_ARCH.txt
    expire_in: 7 days

# Replaces the template's single-arch kaniko build of ./Dockerfile. Every key
# the template sets is set here on purpose: GitLab merges a local job into the
# included one key by key, so a key left out would keep the kaniko version.
# `rules` by !reference, not `extends`: the included job's own rules would win
# over an extended parent's.
aikido-release-image:
  rules: !reference [.sqe_multiarch_rules, rules]
  interruptible: false
  stage: test
  image:
    name: "$AIKIDO_TOOLS_IMAGE"
    entrypoint: [""]
  needs:
    - job: sqe-release-image-arch
      artifacts: true
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
  script:
    - |
      set -eu
      # Belt and braces for the dry run: off a release tag, only :mr-<iid>.
      if [ -z "${CI_COMMIT_TAG:-}" ]; then
        for t in $SQE_IMAGE_TAGS; do
          case "$t" in
            mr-[0-9]*) ;;
            *) echo "refusing to write :$t outside a release tag pipeline"; exit 1 ;;
          esac
        done
      fi
      # shellcheck disable=SC2086 # SQE_IMAGE_TAGS is a word list
      bash scripts/ci-release-index.sh "$CI_REGISTRY_IMAGE" \
        "$(cat image-digest-amd64.txt)" "$(cat image-digest-arm64.txt)" $SQE_IMAGE_TAGS
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 7 days

# grype resolves an index to one platform. The template scan job takes amd64
# (pinned here, not left to the runner's arch); this one scans arm64 of the
# same digest, and the mirror jobs need both.
aikido-release-image-scan:
  variables:
    GRYPE_PLATFORM: "linux/amd64"

sqe-release-image-scan-arm64:
  extends: aikido-release-image-scan
  variables:
    GRYPE_PLATFORM: "linux/arm64"

# The template mirrors with deploy_mirror.py, whose `skopeo copy` has no
# --all: it would put only the runner's platform on Harbor, under another
# digest. Same destination (chameleon/sqlengine/sqe) and tags, copied by digest.
aikido-publish-release-image:
  needs:
    - job: aikido-release-image
      artifacts: true
    - job: aikido-release-image-scan
    - job: sqe-release-image-scan-arm64
  variables:
    HARBOR: "repo.sovereign-data.org/chameleon"
  script:
    - |
      set -eu
      D="$(cat image-digest.txt)"
      SRC_CREDS="$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
      DEST_CREDS="$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
        bash scripts/ci-mirror-release.sh "$CI_REGISTRY_IMAGE@$D" "$D" \
          "$HARBOR/$AIKIDO_IMAGE_NAME" "$CI_COMMIT_TAG" stable

# The release on Harbor's other name, chameleon/sqe (the `make push` repo),
# from the same digest. Fail-closed like the release mirror. `:latest` is not
# written here: it follows main, from `make latest` (scripts/push-latest.sh).
sqe-publish-latest:
  interruptible: false
  stage: .post
  image: "$AIKIDO_TOOLS_IMAGE"
  needs:
    - job: aikido-release-image
      artifacts: true
    - job: aikido-publish-release-image
  variables:
    HARBOR: "repo.sovereign-data.org/chameleon"
  script:
    - |
      set -eu
      D="$(cat image-digest.txt)"
      SRC_CREDS="$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
      DEST_CREDS="$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
        bash scripts/ci-mirror-release.sh "$CI_REGISTRY_IMAGE@$D" "$D" \
          "$HARBOR/sqe" "$CI_COMMIT_TAG" stable
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      exists:
        - Dockerfile

# A merged `release/vX.Y.Z` MR tags its merge commit `vX.Y.Z`; the tag
# pipeline then builds and publishes the release. The branch carries the
# version bump (scripts/release.sh on that branch), and the script refuses a
# tag whose version does not match [workspace.package]. Hotfix branches such
# as `release/0.35.x` do not match and still tag by hand. Not interruptible:
# a later merge to main must not cancel the tag.
sqe-tag-release:
  interruptible: false
  stage: .pre
  needs: []
  image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
  script:
    - python3 scripts/ci-tag-release.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^Merge branch .release\/v\d+\.\d+\.\d+. into/'

# Scheduled rescan of the deployed release; main uses the digest gate.
aikido-image-scan:
  variables:
    AIKIDO_IMAGE: "$CI_REGISTRY_IMAGE:stable"

aikido-sbom:
  variables:
    AIKIDO_SHARED_SCRIPTS: "sbom-license-from-cargo.py"
    # playground/ is outside the cargo workspace (wasm32-only, own Cargo.lock),
    # so its manifest is not in the script's default globs.
    AIKIDO_SBOM_LICENSE_MANIFESTS: "playground/Cargo.toml"
  before_script:
    - !reference [.aikido-shared-scripts, before_script]

# Refresh these reviewed digests when the dependency image is rebuilt. The
# moving main tag is build output, not a trusted immutable test environment.
#
# A stale pin fails silently: cargo reuses a baked crate only when rustc, the
# package id and the features all match, so an image built before a toolchain
# bump is rebuilt from `proc-macro2` in every job and nothing turns red. The
# digest below is `ci-deps:lock-fa9b8dfe478d`, built from 2b9a287c with rustc
# 1.100.0 and vendor/ tree 2dc7f629 (digest sha256:8909b622). Refresh it after any merge that changes
# rust-toolchain.toml, Cargo.lock or vendor/: the `ci-deps-image` job on main
# prints the new digest on its last lines.
# Rules copied from the aikido test-rust template minus the default-branch
# arms: the MR pipeline is the test gate (see the header).
.sqe_rust_changes: &sqe_rust_changes
  - "**/*.rs"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - "rust-toolchain.toml"

aikido-test-rust:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists: ["**/Cargo.toml"]
      changes: *sqe_rust_changes
      allow_failure: false
  image: "$CI_REGISTRY_IMAGE/ci-deps:main@sha256:8909b6227120397f85f1dc5539a5b768e646c4bbaf7f24360a97a469e7c1123e"
  variables:
    AIKIDO_SHARED_SCRIPTS: "reuse-deps-image.sh"
    CARGO_TARGET_DIR: "/opt/sqe-deps/target"
  cache: []
  before_script:
    - !reference [.aikido-shared-scripts, before_script]
    - bash "$AIKIDO_SHARED_HOME/scripts/reuse-deps-image.sh"
    - !reference [.aikido_rust_build_env, before_script]

aikido-rust-extra:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists: ["ci/aikido-rust-extra.sh"]
      changes: *sqe_rust_changes
      allow_failure: false
  image: "$CI_REGISTRY_IMAGE/ci-deps:main@sha256:8909b6227120397f85f1dc5539a5b768e646c4bbaf7f24360a97a469e7c1123e"
  variables:
    AIKIDO_SHARED_SCRIPTS: "reuse-deps-image.sh"
    CARGO_TARGET_DIR: "/opt/sqe-deps/target"
  cache: []
  before_script:
    - !reference [.aikido-shared-scripts, before_script]
    - bash "$AIKIDO_SHARED_HOME/scripts/reuse-deps-image.sh"
    - !reference [.aikido_rust_build_env, before_script]

aikido-clippy-rust:
  rules:
    - when: never

aikido-cargo-lock:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists: ["**/Cargo.toml"]
      changes: *sqe_rust_changes

# Live round trips against the catalogs outside the Iceberg matrix rubric that
# SQE still advertises (#866): Nessie (Iceberg REST), Hive Metastore (Thrift)
# and JDBC on PostgreSQL. They were #[ignore] tests run by hand, so a
# regression waited for the next manual run. Extends aikido-rust-extra for the
# deps image, its warm target dir and the build env. GitLab `services:`
# sidecars, not docker-in-docker. Images are pinned by digest; the tags match
# docker-compose.{test,nessie,hms}.yml, which run the same tests locally. The
# tests only create and drop namespaces, so Nessie needs no S3 service.
catalog-live-tests:
  extends: aikido-rust-extra
  services:
    - name: "postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7"
      alias: postgres
      variables:
        POSTGRES_USER: iceberg
        POSTGRES_PASSWORD: iceberg
        POSTGRES_DB: iceberg_catalog
    - name: "ghcr.io/projectnessie/nessie:0.108.3@sha256:219709df809fcfac7abe0491b2070c8d56178ed29828fb30968a4365b62bcc8a"
      alias: nessie
      variables:
        NESSIE_VERSION_STORE_TYPE: IN_MEMORY
        QUARKUS_HTTP_PORT: "19120"
        NESSIE_CATALOG_DEFAULT_WAREHOUSE: warehouse
        NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: "s3://warehouse/"
    - name: "apache/hive:standalone-metastore-4.1.0@sha256:cc898f60aff301a5b8811b9fcd7631822ffde82180f0d47ef1c24e287e4a9845"
      alias: hive-metastore
      variables:
        SERVICE_NAME: metastore
        DB_DRIVER: derby
        SERVICE_OPTS: "-Dmetastore.warehouse.dir=file:///opt/hive/warehouse"
  variables:
    SQE_TEST_PG_URL: "postgres://iceberg:iceberg@postgres:5432/iceberg_catalog"
    SQE_TEST_NESSIE_URI: "http://nessie:19120/iceberg/"
    SQE_TEST_HMS_URI: "hive-metastore:9083"
  script:
    - |
      set -euo pipefail
      # The runner stops waiting on a service after 30s and starts the job
      # anyway; HMS runs schematool first and takes about a minute. Wait on
      # every port, bounded, rather than fail the first test.
      bash -c '
        for hp in postgres:5432 nessie:19120 hive-metastore:9083; do
          host=${hp%:*}; port=${hp#*:}
          for i in $(seq 1 180); do
            if (exec 3<>"/dev/tcp/$host/$port") 2>/dev/null; then
              echo "$hp up after ${i}s"; break
            fi
            if [ "$i" = 180 ]; then echo "$hp not up after 180s"; exit 1; fi
            sleep 1
          done
        done'
      cargo test -p sqe-catalog --features hms,sql-postgres --test it -- \
        --ignored nessie:: hms:: sql_postgres::
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "crates/sqe-catalog/**/*"
        - "vendor/iceberg-rust/**/*"
        - "Cargo.lock"
        - ".gitlab-ci.yml"
        - "docker-compose.nessie.yml"
        - "docker-compose.hms.yml"

vendored-profile-drift:
  stage: test
  image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  variables:
    GIT_DEPTH: "1"
    DATA_PLATFORM_DIR: "$CI_BUILDS_DIR/data-platform"
  before_script:
    - apk add --no-cache git bash diffutils >/dev/null
  script:
    - |
      set -euo pipefail
      if ! git clone --depth 1           "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/data-platform.git"           "$DATA_PLATFORM_DIR" 2>/dev/null; then
        echo "could not clone data-platform with CI_JOB_TOKEN." >&2
        echo "Add this project to data-platform's CI/CD job token allowlist" >&2
        echo "(Settings > CI/CD > Job token permissions), or run" >&2
        echo "scripts/check-vendored-profile.sh locally before merging." >&2
        echo "NOT passing: the vendored profile may be stale." >&2
        exit 1
      fi
      bash scripts/check-vendored-profile.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "crates/sqe-policy/assets/*.json"
        - "crates/sqe-policy/src/grants/profile.rs"
        - "scripts/check-vendored-profile.sh"

aikido-sast:
  allow_failure: false

# The template's notes (the CHANGELOG section) plus the image digest. Created
# only after both Harbor names hold the release.
gitlab-release:
  extends: .aikido-gitlab-release
  needs:
    - job: aikido-release-image
      artifacts: true
    - job: aikido-publish-release-image
    - job: sqe-publish-latest
  script:
    - V="${CI_COMMIT_TAG#v}"
    - awk -v v="$V" 'index($0, "## [" v "]") == 1 {p=1; next} p && /^## \[/ {exit} p' CHANGELOG.md > release-notes.md
    - '[ -s release-notes.md ] || echo "No CHANGELOG.md section for ${V}." > release-notes.md'
    - |
      set -eu
      D="$(cat image-digest.txt)"
      case "$D" in sha256:*) ;; *) echo "no index digest in image-digest.txt: '$D'"; exit 1 ;; esac
      {
        echo ""
        echo "## Container image"
        echo ""
        echo "One manifest list for linux/amd64 and linux/arm64, digest \`$D\`:"
        echo ""
        echo "- \`repo.sovereign-data.org/chameleon/sqlengine/sqe:$CI_COMMIT_TAG\`"
        echo "- \`repo.sovereign-data.org/chameleon/sqe:$CI_COMMIT_TAG\`"
        echo ""
        echo "Pin it as \`repo.sovereign-data.org/chameleon/sqlengine/sqe@$D\`."
      } >> release-notes.md
    - wc -l release-notes.md
