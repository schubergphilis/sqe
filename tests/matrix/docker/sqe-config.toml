# SQE coordinator for the matrix suite: single node, no workers, Polaris client
# credentials (root / s3cr3t, scope default PRINCIPAL_ROLE:ALL). The one
# [catalog] block surfaces in SQL as catalog "iceberg".
[coordinator]
flight_sql_port = 50051
trino_http_port = 8080
worker_urls = []
allow_unauthenticated_workers = true

[metrics]
prometheus_port = 9090

[auth]
token_endpoint = "http://polaris:8181/api/catalog/v1/oauth/tokens"
client_id = "root"
client_secret = "s3cr3t"

[catalog]
catalog_url = "http://polaris:8181/api/catalog"
warehouse = "demo"

[storage]
s3_endpoint = "http://rustfs:9000"
s3_access_key = "rustfs"
s3_secret_key = "rustfs12345"
s3_region = "us-east-1"
s3_path_style = true

# remove_orphan_files refuses a cutoff newer than now minus this floor (default
# one day). The matrix plants its own orphan file and needs a real delete, so the
# floor is one second here; mode stays "off", no scheduler runs.
[maintenance]
orphan_min_age_secs = 1
