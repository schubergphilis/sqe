# cargo-audit reads this file separately from cargo-deny's deny.toml.
# Every retained exception has an unchanged review date and owner.
#
# Removed on 2026-10-02: RUSTSEC-2023-0071 (rsa is absent from Cargo.lock,
# including the explicitly selected AWS-LC JWT provider), and
# RUSTSEC-2026-0176/0177 (pyo3 is now patched 0.29.2 in the lockfile).
#
# Removed on 2026-10-08: RUSTSEC-2026-0194/0195 (quick-xml 0.39.4 is absent
# from Cargo.lock; object_store 0.13.2 is patched to quick-xml ^0.41 in
# vendor/object_store).
#
# RUSTSEC-2026-0391 (zstd < 0.14.3): cargo-audit matches the lockfile label
# zstd 0.13.4, but vendor/zstd ([patch.crates-io]) is the 0.14.3 code that
# fixes it, on zstd-safe 8.2.0. arrow/parquet 59 and DataFusion 55 require
# zstd ^0.13. Drop the ignore with the patch when DataFusion 56 ships.
# cargo-deny does not match path crates, so deny.toml has no entry.
#
# paste 1.0.15 is an unmaintained proc macro with no known vulnerability;
# upstream Arrow/DataFusion/tonic migration is still pending.
[advisories]
ignore = [
    "RUSTSEC-2024-0436",  # review-by 2026-12-25 owner=sqe-maintainers
    "RUSTSEC-2026-0391",  # review-by 2027-01-26 owner=sqe-maintainers
]
