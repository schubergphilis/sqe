[workspace]
resolver = "2"
members = [
    "crates/sqe-core",
    "crates/sqe-auth",
    "crates/sqe-catalog",
    "crates/sqe-sql",
    "crates/sqe-policy-api",
    "crates/sqe-policy",
    "crates/sqe-planner",
    "crates/sqe-trino-functions",
    "crates/sqe-write",
    "crates/sqe-coordinator",
    "crates/sqe-server",
    "crates/sqe-compaction",
    "crates/sqe-worker",
    "crates/sqe-trino-protocol",
    "crates/sqe-trino-compat",
    "crates/sqe-metrics-core",
    "crates/sqe-metrics",
    "crates/sqe-spill",
    "crates/sqe-lineage",
    "crates/sqe-quack-wire",
    "crates/sqe-quack-server",
    "crates/sqe-quack-client",
    "crates/sqe-mcp",
    "crates/sqe-cli",
    "crates/sqe-bench",
    "crates/workspace-hack",
    "xtask",
]
# Exclude vendored trees. They are referenced via path / [patch], not members.
exclude = ["vendor/iceberg-rust", "vendor/datafusion-iceberg", "vendor/sqlite-rs"]

[workspace.package]
version = "0.48.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://gitlab.schubergphilis.com/data-ai/chameleon/sqlengine"
homepage = "https://gitlab.schubergphilis.com/data-ai/chameleon/sqlengine"
authors = ["Schuberg Philis"]

# Inherited by crates that declare `[lints] workspace = true`. Issue #643: a
# `std::sync` guard held across an `.await` pins a runtime worker and, if the
# same lock is taken on another task on that worker, deadlocks. Deny it so the
# compiler finds the hold instead of a reviewer reasoning about temporaries.
[workspace.lints.clippy]
await_holding_lock = "deny"

[workspace.dependencies]
# Query engine — DataFusion 55. See docs/evidence/perf/df55-arrow59-ab.md for
# the validated upgrade results and docs/internal/research/2026-09-02-datafusion-55-followups.md
# for the post-upgrade workaround and feature audit.
datafusion = "55"
datafusion-expr = "55"
datafusion-proto = "55"

# Arrow 59 / Parquet 59 — aligned with DataFusion 55
arrow = { version = "59", features = ["prettyprint", "ipc_compression"] }
arrow-flight = { version = "59", features = ["flight-sql-experimental"] }
arrow-ipc = { version = "59", features = ["lz4", "zstd"] }
# `serde` is enabled for cycle 5: a Hive ScanTask carries the table's full
# Arrow schema so a worker can type directory-encoded partition literals the
# same way the coordinator does. The feature only adds Serialize/Deserialize
# impls; it changes no behaviour for anything already using arrow-schema.
arrow-schema = { version = "59", features = ["serde"] }
arrow-array = "59"
arrow-cast = "59"
arrow-buffer = "59"
parquet = { version = "59", features = ["async", "object_store"] }
object_store = { version = "0.13", features = ["aws", "http", "azure", "gcp"] }

# Iceberg — apache/iceberg-rust main @ 119fad92c, with RisingWave
# dev_rebase_main_20260807 merged on top for the row-level write stack apache
# lacks (ReplaceFilesAction for rewrite/overwrite, position-delete and
# deletion-vector writers, rewrite manifests), then SQE's patch families.
# Arrow / Parquet 59.2, no DataFusion dependency in core.
# Vendored in vendor/iceberg-rust/ — see vendor/iceberg-rust/README.md
iceberg = { path = "vendor/iceberg-rust/crates/iceberg" }
# Object storage moved out of iceberg core into this crate (OpenDAL-backed
# StorageFactory). S3 / GCS / Azure are features of this crate now.
iceberg-storage-opendal = { path = "vendor/iceberg-rust/crates/storage/opendal", default-features = false, features = ["opendal-memory", "opendal-fs", "opendal-s3"] }
# No default `aws-sigv4` on this path dep: sqe-catalog's `rest-sigv4`
# feature enables it for coordinator/worker builds. Slim Polaris-only
# builds pass `--no-default-features --features rest` on sqe-catalog.
iceberg-catalog-rest = { path = "vendor/iceberg-rust/crates/catalog/rest" }
# DataFusion integration: apache/datafusion-iceberg (split out of
# iceberg-rust on 2026-09-17, not published). Vendored unmodified.
datafusion-iceberg = { path = "vendor/datafusion-iceberg/crates/datafusion" }
# Optional catalog backends, vendored from upstream apache/iceberg-rust
# v0.9.0 alongside the RisingWave fork. Gated by cargo features in
# sqe-catalog so a default REST-only build does not pull in AWS SDK,
# Thrift, or sqlx weight.
iceberg-catalog-hms = { path = "vendor/iceberg-rust/crates/catalog/hms" }
iceberg-catalog-glue = { path = "vendor/iceberg-rust/crates/catalog/glue" }
iceberg-catalog-sql = { path = "vendor/iceberg-rust/crates/catalog/sql" }
# Pure-Rust SQLite (Lab271/sqlite-rs, facade branch snapshot). Library only,
# zero dependencies; gated by sqe-catalog `sql-sqlite-rs`. See
# vendor/sqlite-rs/README.md for provenance and the refresh recipe.
sqlite-rs = { path = "vendor/sqlite-rs" }
# AWS S3 Tables (managed Iceberg). Vendored from risingwavelabs fork
# main; gated by sqe-catalog `s3tables` feature.
iceberg-catalog-s3tables = { path = "vendor/iceberg-rust/crates/catalog/s3tables" }
# Catalog factory dispatch. Loads any of the registered backends
# (rest / glue / s3tables / hms / sql) by string name with a uniform
# props HashMap. Replaces SQE's per-backend match dispatch.
# `default-features = false` so each backend feature in sqe-catalog
# (rest / glue / hms / sql / s3tables) controls which builders the
# loader registry actually includes; without this the upstream
# default pulls every backend's transitive AWS SDK / Thrift / sqlx
# weight unconditionally.
iceberg-catalog-loader = { path = "vendor/iceberg-rust/crates/catalog/loader", default-features = false }
sqlx = { version = "0.9.0", default-features = false }

# SQL parser — SQE pins this directly for the `visitor` feature (VisitMut derive
# used by sqe-sql for AST rewrites like Trino-compat CAST(v AS JSON) -> to_json(v)).
# Kept aligned with the version DataFusion 54 pulls transitively (0.62) so a single
# sqlparser ships and SQE's pre-parser shares DataFusion's exact grammar. Re-align
# this pin whenever the DataFusion bump moves its sqlparser requirement.
sqlparser = { version = "0.62", features = ["visitor"] }

# JSON functions for DataFusion (Trino json_extract compat)
datafusion-functions-json = "0.55.3"

# Async — use only what is needed; avoid ["full"] which includes fs/process/io-std
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs"] }

# HTTP
axum = "0.8"
# `rustls-no-provider`, not `rustls`: reqwest 0.13's `rustls` feature hardwires
# the aws-lc provider (`__rustls-aws-lc-rs`), which is the C build every SQE
# binary was paying for. With ring the only provider feature in the graph,
# rustls selects it automatically for every client reqwest builds.
reqwest = { version = "0.13", features = ["json", "rustls-no-provider", "form", "query"], default-features = false }
# The vendored iceberg-catalog-rest still builds on reqwest 0.12, so its
# `RestCatalogBuilder::with_client` needs a 0.12 `Client`. sqe-catalog builds
# one with the same `[catalog]` deadlines (review 300). No features: the
# vendored crate already selects TLS; this only names the type.
reqwest_legacy = { package = "reqwest", version = "0.12", default-features = false }

# gRPC (Arrow Flight) — arrow-flight 57 requires tonic 0.14
# `tls-native-roots` is what lets `sqe_core::tls::tonic_client` reach an
# `https://` peer that has no explicit `[coordinator.tls] ca_file`. Finding
# 603: with no root-store feature at all, tonic refuses every `https` URI
# ("Connecting to HTTPS without TLS enabled"), so there was no configuration
# that produced an encrypted, working distributed cluster. A private cluster
# CA still has to be named in `ca_file`; the OS trust store will not have it.
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
prost = "0.14"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# Concurrency / Caching
dashmap = "6"
moka = { version = "0.12", features = ["future", "sync"] }

# Rate limiting
governor = "0.10"

# Auth
# PINNED at 9 by decision, not by blocker. The 11.x bump arrived via renovate
# !728 unvalidated and cost two separate failures: 11 ships NO crypto provider
# by default, so every JWT verification panicked at runtime while compiling
# perfectly clean (!738), and the `rust_crypto` provider that fixes that pulls
# p256/p384 and transitively fiat-crypto. The other provider, `aws_lc_rs`,
# needs a C toolchain (aws-lc-sys) at build time, which is worse for
# reproducible cross-platform builds.
#
# 9.x needs no provider selection at all, so there is no runtime-only failure
# mode to guard against, and it carries a smaller crypto dependency tree. Do
# not let a bot bump this: renovate is configured to treat it as a major, and
# any move to 11 has to come with an explicit provider feature and a test that
# actually verifies a token rather than merely type-checking.
jsonwebtoken = "9"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "metrics", "logs"] }
tracing-opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.32"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Data generation
csv = "1"
# rand 0.10. Output for a given StdRng seed is not stable across rand
# releases. The 0.8 -> 0.10 bump was attempted and reverted once (#390):
# unplanted TPC-DS q29/q85 went empty. Those coincidences are now planted
# (!857). A 0.10 data set is a new draw, not comparable to 0.8 baselines
# in benchmarks/results/ without a fresh generate + compare-trino.
# API: gen_range -> random_range, gen_bool -> random_bool, gen -> random,
# thread_rng -> rng, Rng -> RngExt.
rand = "0.10"
ring = "0.17"

# Crypto
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
subtle = "2"
zeroize = "1"


# Dev / test deps used by multiple crates
tempfile = "3"
wiremock = "0.6"

# Misc
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
bytes = "1"

# Unicode normalization for Trino normalize() function
unicode-normalization = "0.1"
# Stemming for Trino word_stem() function
rust-stemmers = "1"
# Timezone support for with_timezone/at_timezone
chrono-tz = "0.10"
# Cron expression parsing/evaluation for the maintenance scheduler's
# `schedule` config (`crates/sqe-coordinator/src/maintenance_scheduler.rs`).
# MIT-licensed, chrono-native, actively maintained.
croner = "4"
# Regex for Trino regexp_extract/extract_all/split
regex = "1"
futures = "0.3"
tokio-util = "0.7"
# Non-poisoning mutex for lifecycle state touched from request handlers (#643).
parking_lot = "0.12"

# Puffin NDV sketches — pure-Rust Apache DataSketches theta implementation.
# Used by `crates/sqe-catalog/src/puffin_stats.rs` to write theta sketches
# into Puffin sidecar files for the Iceberg statistics file list.
datasketches = { version = "0.5", features = ["theta"] }

# Zip archive reading for read_json(compression => 'zip'). deflate-only
# (no bzip2/lzma/zstd zip methods needed); default-features off to skip
# those extra compression backends.
zip = { version = "8", default-features = false, features = ["deflate"] }

# Gzip (de)compression for read_json(compression => 'gzip') buffer path.
flate2 = { version = "1" }

# ── Dev profile: fast incremental builds ───────────────────────
[profile.dev]
# Line-tables only — enough for backtraces/panics, much less to generate.
debug = 1
# Avoid one loose .o file per codegen unit. `unpacked` accumulated ~385k
# objects under target/debug/deps and made Defender-scanned builds degrade.
split-debuginfo = "off"

# Third-party dependencies (the `*` glob matches every non-workspace crate)
# carry no debuginfo. We almost never step into the ~760 upstream crates with a
# debugger, but generating + linking their line tables is a large slice of a
# cold/feature-changed build. First-party crates keep `debug = 1` from above,
# so panics and backtraces in our own code stay fully attributed. Behaviour is
# unchanged; only debug symbols inside dependency frames are dropped.
[profile.dev.package."*"]
debug = false

# Cargo's test profile does not inherit the dev profile customizations. Keep
# first-party line tables for useful failure backtraces, but avoid full DWARF
# and loose split-debug objects for every test harness and dependency.
[profile.test]
debug = 1
split-debuginfo = "off"

[profile.test.package."*"]
debug = false

# ── Release profile: fast builds with good runtime performance ─
[profile.release]
codegen-units = 4        # More parallelism during codegen (default=1)
lto = "thin"             # Thin LTO: ~80% of full LTO benefit, much faster link
strip = true             # Strip debug symbols from binary (~50% smaller)

# ── Dev-release profile: optimized runtime, cheap compile ──────
# Use this for benchmark iteration (`cargo build --profile dev-release`).
# Drops thin-LTO (big RAM spike at link time) and cranks codegen-units
# (more parallelism, faster per-crate compile). Same opt-level as release
# so query perf is representative; binary is a bit larger and lacks the
# last few % of LTO-driven inlining.
[profile.dev-release]
inherits = "release"
lto = false              # Skip LTO — the link-time RAM peak is what
                         # pushes the machine into swap thrashing.
codegen-units = 16       # More parallel codegen per crate; faster wall time.
incremental = true       # Reuse artifacts across iterations — huge for loop work.
strip = false            # Keep symbols; benchmarks want readable traces.

[workspace.metadata.cargo-machete]
# hakari's workspace-hack is linked for feature unification, never imported.
# `make deps-check` scans crates/sqe-* only, so the hack crate's own manifest
# (every dep unused by design) is never inspected.
ignored = ["workspace-hack"]
