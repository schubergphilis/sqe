# gitleaks configuration for SQE.
#
# Extends the built-in default ruleset and allowlists the known false positives
# in this repo. gitleaks auto-discovers this file when it scans from the repo
# root, so it is honored by:
#   * local runs        -> gitleaks dir .        (or gitleaks detect)
#   * the commit hook    -> .pre-commit-config.yaml (gitleaks git --staged)
#   * the CI gate        -> aikido-secret-scan job (gitleaks detect --no-git)
#   * the history scan   -> aikido-secret-scan-history (weekly schedule)
# without any --config flag.
#
# Design rule: keep suppressions as narrow as possible so real secrets are still
# caught. Prefer, in order:
#   1. an inline `gitleaks:allow` comment on the offending line (travels with the
#      code, cannot mask a leak in any other file) -- used for the test fixtures
#      in crates/sqe-core/src/secret.rs,
#   2. an exact-value allowlist for a unique, unmistakable example string,
#   3. for a finding in an old blob that no value rule fits, its fingerprint in
#      .gitleaksignore (commit:file:rule:line, cannot match anything else).
#
# Never combine `paths` with `regexes` under condition = "AND". The gitleaks in
# use (8.30) then suppresses EVERY finding in those paths, whatever the regex
# says. Until 2026-09-25 such a block hid all secrets under docs/, openspec/,
# testing/ and scripts/: a planted AWS key there went unreported. Path-only
# entries remain solely for paths that are exempt as a whole (build output,
# vendored code, the TLS test key files). Before adding one, plant a fake key
# in the path and confirm it is still reported elsewhere.
#
# NOTE: this scans committed content only. It does NOT catch runtime leaks such
# as a secret written to a log at execution time -- those need a code fix.

[extend]
useDefault = true

# 1. Generated build output and vendored third-party code. Never our secrets;
#    scanned upstream, not here. Also keeps the scan fast (34MB vs 620MB).
[[allowlists]]
description = "Build output and vendored code"
paths = [
    '''(^|/)target/''',
    '''(^|/)docs/target/''',
    '''(^|/)vendor/''',
]

# 2. Committed TLS test fixtures. crates/sqe-core/tests/fixtures/tls/ holds a
#    throwaway self-signed CA and two leaf key pairs (SAN worker-1.sqe.test /
#    localhost) that exist only so the TLS builder and certificate-reload tests
#    can run without openssl at test time. They sign nothing outside the test
#    process. Path-only, so it covers exactly the .key files in that directory.
[[allowlists]]
description = "TLS test fixtures (key files in one directory)"
paths = [
    '''(^|/)crates/sqe-core/tests/fixtures/tls/[^/]+\.key$''',
]

# 3. Values that cannot be real secrets, matched against the extracted secret
#    only (the default regexTarget), in any path. Each is a documented
#    placeholder, a published quickstart default, a test fixture, or a shape
#    no credential has.
[[allowlists]]
description = "Placeholder, fixture and published-default values"
regexes = [
    # Example API keys in api_key.rs doc-comments and the deployment docs.
    '''sqe_k?_?abc123def456''',
    '''sqe_k?_?xyz789ghi012''',
    # PKCS#1 RSA key used only for JWT-signing tests (bearer_token.rs
    # TEST_RSA_PRIVATE_KEY_PEM); matched by its unique leading bytes so a real
    # RSA key cannot be masked. Lives inside a string literal, so it cannot take
    # an inline gitleaks:allow comment.
    '''MIIEowIBAAKCAQEAvX0NLGQkeecTCMwoDPx6Qkutsf0PWBEjZnNm4vkmTTvHD1F0''',
    # PKCS#8 P-256 key used only for ES256 JWT-signing tests (bearer_token.rs
    # TEST_EC_PRIVATE_KEY_PEM), matched by its unique leading bytes. The `+`
    # is base64 payload, not a quantifier, so it must be escaped.
    '''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgcb/PT1Xj\+xW0FvVc''',
    # Test fixtures in crates/sqe-core/src/secret.rs. They carry inline
    # `gitleaks:allow` comments now, but the history scan reads old blobs where
    # the comment was not present yet. Dummies asserting Debug redaction works.
    '''hunter2-very-private''',
    '''0123456789abcdef''',
    # HMAC-SHA256 fixture digest in sha256_udf.rs (key=pepper / msg=SSN).
    '''40966d99be0fda85dac0b2f8d9f00b434b89b0d3e2b3f4bdcbf1dd31a2b7092f''',
    # Doc and test-script placeholders: `-u jacob:your-password` in the book,
    # `-u root:s3cr3t` in the tempto notes.
    '''your-password''',
    '''\bs3cr3t\b''',
    # Published quickstart defaults: the Ranger admin password (in
    # docker-compose.yml, ranger/install.properties and the README) and the
    # Keycloak demo user carol (keycloak/realm-ranger.json). Gate nothing outside
    # a laptop.
    '''rangerR0cks!''',
    '''carol123''',
    # `Basic cm9vdDpyb290` = root:root, the default of a removed Trino test script.
    '''cm9vdDpyb290''',
    # The MCP quickstart test sends this bearer to prove a bad token gets 401;
    # base64 "sqe-writer-token-1" is the documented token_b64 example.
    '''not\.a\.valid\.jwt''',
    '''c3FlLXdyaXRlci10b2tlbi0x''',
    # Test scripts pass credentials as shell variables (`-u "$SQE_USER:..."`,
    # `${SQE_USER:-root}`); a real credential never starts with `$`.
    '''^\$\{?[A-Za-z_]''',
    # generic-api-key reads TPC-H join predicates in committed EXPLAIN output
    # (`c_custkey = tpch_sf1.orders.o_custkey`) as key = value. The value is a
    # dotted column identifier ending in `x_...key`.
    '''^([a-z0-9_]+\.)*[a-z]{1,2}_[a-z]+key$''',
]

# Findings no value rule fits are listed by fingerprint in .gitleaksignore.
