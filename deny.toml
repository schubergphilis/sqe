# cargo-deny configuration for SQE
# https://embarkstudios.github.io/cargo-deny/
#
# SUPPLY CHAIN NOTE: Three iceberg crates are sourced from a third-party fork:
#   github.com/risingwavelabs/iceberg-rust.git
#   branch dev_rebase_main_20260303 @ c034b19105fa  (DEP-05: was stale 1978911ec4)
# cargo-deny's advisory database does NOT cover git dependencies.
# The pinned rev mitigates force-push attacks. Verify the SHA matches the
# vendored tree (Cargo.toml:54 / vendor/iceberg-rust/README.md):
#   git ls-remote https://github.com/risingwavelabs/iceberg-rust.git | grep c034b19105fa
# Migration to upstream apache/iceberg-rust planned once OverwriteAction is merged.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste (v1.0.15): unmaintained but feature-complete proc macro.
    # Transitive dependency from arrow-flight, datafusion, parquet, tonic.
    # No known vulnerability. Upstream migration pending.
    "RUSTSEC-2024-0436",  # review-by 2026-12-25 owner=sqe-maintainers
    # RSA is absent from Cargo.lock; the JWT provider explicitly uses AWS-LC.
    # Patched pyo3 0.29.2 is locked; old RSA/PyO3 ignores are removed from audit.
    # RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101.7) were ignored while the
    # AWS Glue/S3Tables backends used aws-config's legacy hyper-0.14/rustls-0.21
    # connector. Fixed (#133): the vendored glue/s3tables catalogs now build an
    # explicit rustls-0.23 HttpClient, and aws-config/aws-sdk-glue/aws-sdk-s3tables
    # run with `default-features = false`, so the legacy stack (rustls 0.21,
    # webpki 0.101.7, hyper 0.14) is gone from the tree. Ignores removed so the
    # gate catches any regression.
    # RUSTSEC-2026-0194/0195 (quick-xml < 0.41) were ignored until 2026-10-08:
    # object_store 0.13.2 is now patched to quick-xml ^0.41 (vendor/object_store,
    # [patch.crates-io] in Cargo.toml) and no older quick-xml is locked.
]

# Without this section cargo-deny 0.20 rejects EVERY license as "not explicitly
# allowed": about 600 `error[rejected]` lines per CI job and `licenses FAILED`
# (non-blocking, so it went unnoticed), which buried any real finding. The
# allow list is the intersection of the platform's license policy
# (aikido `policy/license-policy.json` `allowed`, the same list the blocking
# `aikido-license-policy` SBOM job enforces) with what the dependency graph
# actually carries (`cargo deny --all-features list -l license`). A crate
# whose expression is an OR passes when one branch is allowed, which is how
# `r-efi` (MIT OR Apache-2.0 OR LGPL-2.1-or-later) is fine without allowing
# LGPL here. Adding a license means adding it to the platform policy first.
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    # Apache-2.0 with the LLVM exception is Apache-2.0 for the policy's
    # purposes (rustix, linux-raw-sys, blake3, wasi); cargo-deny needs the
    # exact SPDX expression.
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
