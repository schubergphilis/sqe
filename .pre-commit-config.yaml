# Local analog of Aikido's `.pre` guardrails: the cheap checks that should
# fail a commit before CI does.
#
# - Secrets: gitleaks with the same `.gitleaks.toml` as CI's
#   `aikido-secret-scan`, scanning staged files (the full-history pass stays
#   schedule-only in CI, `aikido-secret-scan-history`).
# - Rust style: a rustfmt ratchet on staged .rs files. Main carries rustfmt
#   drift in ~275 files, so a touched file fails only when it gains hunks
#   (scripts/pre-commit-hook.sh explains why; never `cargo fmt --all`).
# - Supply chain: when Cargo.toml, Cargo.lock, deny.toml or
#   .cargo/audit.toml is staged, the lock must match the manifests, the
#   workspace-hack must be in sync (CI's `cargo hakari generate --diff`),
#   and cargo-deny + cargo-audit must pass. A changed crate manifest also
#   runs cargo-machete. Each takes 5-30 s and needs no compile.
# - Shell: shellcheck at error severity on staged scripts.
# - Pre-push: clippy on the whole workspace, warnings denied.
#
# Semgrep, grype, trivy, and syft stay in CI: they need the aikido-tools
# image and are too heavy for a commit hook.
#
# Tools: pre-commit, rustfmt, cargo-deny, cargo-audit, cargo-hakari,
# cargo-machete (`make check-tools` lists them). Install once from the repo root:
#   pre-commit install
# Run against staged files:
#   pre-commit run
#   make pre-commit
# Run the repo-wide checks (supply chain + clippy) without staging anything:
#   make pre-commit-repo
# Skip one hook for a single commit or push: SKIP=clippy git push
#
# Do not run `pre-commit run --all-files`: the whitespace fixers would
# rewrite ~1500 files that predate them. They are meant for staged files.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^(vendor/|target/|docs/target/)

repos:
  # Same scanner as aikido-secret-scan. The official `gitleaks` hook compiles
  # from this tag (language: golang) so we do not pick up a system binary.
  # Homebrew's v8.30.1 bottle is a known silent no-op (gitleaks/gitleaks#2170);
  # aikido-tools vendors the same 8.30.1 line via a digest-pinned image.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-env-files
        name: no .env files
        entry: bash -c 'echo ".env file staged — use .env.example instead" && exit 1'
        language: system
        files: (^|/)\.env$
        exclude: \.env\.(example|test)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        # Helm templates are not YAML until rendered; multi-doc compose/k8s
        # manifests are valid and must not be split to appease the linter.
        # `--unsafe` keeps the syntax check but stops the hook constructing
        # values, which is what lets .gitlab-ci.yml carry GitLab's own
        # `!reference` tag; `glab ci lint` is the semantic check for that file.
        args: [--allow-multiple-documents, --unsafe]
        exclude: ^deploy/helm/.*/templates/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  # Pinned binary, so a fresh checkout needs no system shellcheck. Error
  # severity only: 27 scripts carry warnings today, none an error.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]
        types: [shell]
        exclude_types: [zsh]

  - repo: local
    hooks:
      - id: rustfmt-ratchet
        name: rustfmt (no new drift)
        entry: scripts/pre-commit-hook.sh rustfmt
        language: system
        types: [rust]

      - id: cargo-lockfile
        name: Cargo.lock matches the manifests
        entry: scripts/pre-commit-hook.sh lockfile
        language: system
        files: (^|/)Cargo\.(toml|lock)$
        pass_filenames: false

      - id: cargo-hakari
        name: workspace-hack in sync (cargo hakari)
        entry: scripts/pre-commit-hook.sh hakari
        language: system
        files: (^|/)Cargo\.(toml|lock)$|^\.config/hakari\.toml$
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny (advisories, bans, sources)
        entry: scripts/pre-commit-hook.sh deny
        language: system
        files: (^|/)Cargo\.(toml|lock)$|^deny\.toml$
        pass_filenames: false

      - id: cargo-audit
        name: cargo audit (RUSTSEC)
        entry: scripts/pre-commit-hook.sh audit
        language: system
        files: ^Cargo\.lock$|^\.cargo/audit\.toml$
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete (unused dependencies)
        entry: scripts/pre-commit-hook.sh machete
        language: system
        files: ^crates/sqe-[^/]+/Cargo\.toml$
        pass_filenames: false

      - id: clippy
        name: clippy (warnings denied)
        entry: scripts/pre-commit-hook.sh clippy
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
