# SQE vendored copy of datafusion-functions-json 0.54.2.
#
# Why vendored: upstream has no DataFusion 55 release (latest tag v0.54.2,
# newest DF-prep commit is "Prepare for DataFusion 54"), and 0.54.2 requires
# `datafusion ^54`. It was the ONLY reverse dependency holding DataFusion 54
# (and therefore arrow 58) in SQE's tree, which produced the duplicate
# `arrow_schema` link error that failed renovate !886. Only the datafusion
# requirement moves here; the crate's own API is untouched.
#
# The version string stays 0.54.2 deliberately. Upstream never released an
# 0.55, so claiming one would be a lie in the lockfile, and the root
# requirement of "0.54" still resolves through [patch.crates-io].
#
# Retire this the moment upstream publishes a DataFusion 55 release: drop the
# directory and the [patch.crates-io] entry, and bump the root requirement.
#
# Two fixes exist on upstream main but not in 0.54.2 and are NOT taken here
# (they are unreleased and orthogonal to the version bump):
#   ca9d4c6e json_get_int/json_get_float returning null for negative numbers
#   774c570c panic on JSON integers outside the i64 fast path (#124)

[package]
name = "datafusion-functions-json"
version = "0.54.2"
edition = "2021"
rust-version = "1.88.0"
description = "JSON functions for DataFusion"
license = "Apache-2.0"
repository = "https://github.com/datafusion-contrib/datafusion-functions-json/"
readme = "README.md"

[lib]
name = "datafusion_functions_json"
path = "src/lib.rs"

[dependencies]
datafusion = { version = "55", features = ["sql"], default-features = false }
jiter = "0.15.0"
log = "0.4"
paste = "1"
serde_json = "1"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"

[lints.clippy.pedantic]
level = "deny"
priority = -1
