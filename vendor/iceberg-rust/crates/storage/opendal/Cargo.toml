[package]
edition = { workspace = true }
license = "Apache-2.0"
name = "iceberg-storage-opendal"
publish = true
repository = { workspace = true }
version = { workspace = true }

categories = ["database"]
description = "Apache Iceberg OpenDAL storage implementation"
keywords = ["iceberg", "opendal", "storage"]

[features]
default = ["opendal-memory", "opendal-fs", "opendal-s3"]
opendal-all = [
  "opendal-memory",
  "opendal-fs",
  "opendal-s3",
  "opendal-gcs",
  "opendal-oss",
  "opendal-azdls",
  "opendal-azblob",
  "opendal-hf",
]
prometheus = ["dep:opendal-layer-prometheus", "dep:prometheus"]

opendal-azblob = ["opendal/services-azblob"]
opendal-azdls = ["opendal/services-azdls"]
opendal-fs = ["opendal/services-fs"]
opendal-gcs = ["opendal/services-gcs"]
opendal-hf = ["opendal/services-hf"]
opendal-memory = ["opendal/services-memory"]
opendal-oss = ["opendal/services-oss"]
opendal-s3 = ["opendal/services-s3", "reqsign-aws-v4", "reqsign-core"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cfg-if = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
once_cell = { workspace = true }
opendal = { workspace = true }
# SQE PATCH (ring-only TLS): opendal's no-provider reqwest transport is not
# installed by `opendal::install_default` (that only fires for the
# `http-transport-reqwest` feature), so this crate installs it itself.
opendal-http-transport-reqwest = { version = "0.58", default-features = false, features = ["rustls-no-provider"] }
opendal-layer-prometheus = { version = "0.58", optional = true }
prometheus = { version = "0.14", optional = true }
reqsign-aws-v4 = { version = "3.0.0", optional = true }
reqsign-core = { version = "3.0.0", optional = true }
serde = { workspace = true }
typetag = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
iceberg_test_utils = { path = "../../test_utils", features = ["tests"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
