[package]
edition = { workspace = true }
homepage = { workspace = true }
name = "iceberg-catalog-rest"
rust-version = { workspace = true }
version = { workspace = true }

categories = ["database"]
description = "Apache Iceberg Rust REST API"
keywords = ["iceberg", "rest", "catalog"]
license = "Apache-2.0"
repository = { workspace = true }

[features]
# SigV4 auth for AWS Iceberg REST endpoints (S3 Tables, Glue Iceberg
# REST, Lake Formation). Off by default so a pure-OSS REST stack
# (Polaris, Nessie, Lakekeeper) doesn't pull in the AWS SDK.
aws-sigv4 = ["dep:aws-sigv4", "dep:aws-credential-types", "dep:aws-config", "dep:bytes"]

[dependencies]
async-trait = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
gcp_auth = "0.12"
http = { workspace = true }
iceberg = { workspace = true }
itertools = { workspace = true }
# MUST match the workspace opentelemetry version. `vendor/iceberg-rust` is
# excluded from the workspace (root Cargo.toml `exclude`), so this cannot
# inherit `workspace = true` and drifts silently. A mismatch puts two
# opentelemetry versions in the graph, each with its OWN global propagator
# registry: the binary installs the propagator into one, this client reads
# the other, finds none, and emits no `traceparent` header. Everything still
# compiles; distributed tracing just stops. See sqe-catalog
# tests/mount_rest_test.rs::polaris_requests_preserve_the_incoming_trace_id.
opentelemetry = "0.32"
reqwest = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
tracing-opentelemetry = "0.33"
typed-builder = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# Optional AWS SigV4 signer for the AWS Iceberg REST endpoints. Pinned
# to the same major as `aws-config 1.8.7` already in the workspace.
aws-sigv4 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-config = { version = "1.8.7", optional = true }
bytes = { workspace = true, optional = true }

[dev-dependencies]
iceberg_test_utils = { path = "../../test_utils", features = ["tests"] }
mockito = { workspace = true }
tokio = { workspace = true }
