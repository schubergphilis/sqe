[package]
edition = { workspace = true }
homepage = { workspace = true }
name = "iceberg-catalog-sql"
rust-version = { workspace = true }
version = { workspace = true }

categories = ["database"]
description = "Apache Iceberg Rust Sql Catalog"
keywords = ["iceberg", "sql", "catalog"]
license = "Apache-2.0"
repository = { workspace = true }

[dependencies]
async-trait = { workspace = true }
iceberg = { workspace = true }
# MUST match the workspace sqlx version. `vendor/iceberg-rust` is excluded
# from the workspace (root Cargo.toml `exclude`), so this cannot inherit
# `workspace = true`. A mismatch pulls a second sqlx, and with it a second
# libsqlite3-sys -- both of which declare `links = "sqlite3"`, which cargo
# refuses, blocking any rusqlite bump with a resolution error far from here.
sqlx = { version = "0.9.0", features = ["any"], default-features = false }
strum = { workspace = true }

