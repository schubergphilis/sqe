# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
platforms = [
    # "x86_64-unknown-linux-gnu",
    # "x86_64-apple-darwin",
    # "aarch64-apple-darwin",
    # "x86_64-pc-windows-msvc",
]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

# The hack must never widen the default build. hakari unifies the none,
# default and all feature sets of every member, and `all` for sqe-catalog and
# sqe-cli turns on the optional catalog backends (glue, s3tables, hms,
# sql-postgres). Those stay opt-in features, so every package that only exists
# because of them is excluded from the generated crate. Regenerate and diff
# `cargo tree --workspace` against main after touching this list; the hack
# must add exactly one package (itself).
[final-excludes]
third-party = [
    { name = "aws-sdk-glue" },
    { name = "aws-sdk-s3tables" },
    { name = "iceberg-catalog-loader", path = "vendor/iceberg-rust/crates/catalog/loader" },
    { name = "iceberg-catalog-glue", path = "vendor/iceberg-rust/crates/catalog/glue" },
    { name = "iceberg-catalog-hms", path = "vendor/iceberg-rust/crates/catalog/hms" },
    { name = "iceberg-catalog-s3tables", path = "vendor/iceberg-rust/crates/catalog/s3tables" },
    { name = "iceberg-catalog-sql", path = "vendor/iceberg-rust/crates/catalog/sql" },
    { name = "hive_metastore" },
    { name = "volo" },
    { name = "volo-thrift" },
    { name = "pilota" },
    { name = "motore" },
    { name = "sqlx" },
    { name = "sqlx-postgres" },
    { name = "sqlx-sqlite" },
    { name = "sqlx-core" },
]
