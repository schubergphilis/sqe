# Spark configuration for the polaris-ranger-keycloak quickstart (Spark cross-compare).
#
# Catalog: Polaris as Iceberg REST catalog. NO credential is configured here, on
#          purpose: the caller supplies their own bearer token per invocation.
# Masking: Kyuubi RangerSparkExtension reads the Ranger `query` service policies and
#          injects the mask expression before execution.
#
# ── Why there is no `credential` line ────────────────────────────────────────
#
# There used to be `spark.sql.catalog.sales_wh.credential = root:<secret>` here, so
# every spark-sql in this container reached Polaris as the ROOT service account. That
# made the object tier untestable, and worse, it defeated per-user identity
# elsewhere in the same session. A per-user token governs only the catalog it is
# attached to, so with a root-credentialed alias present for the same warehouse:
#
#   bob's session, per-user token on catalog `p`:
#     SELECT count(*) FROM p.ac.orders          -> denied, LOAD_TABLE
#     SELECT count(*) FROM sales_wh.ac.orders   -> 3
#
# Overriding the alias's `token` does not help: Iceberg prefers `credential` when
# both are set (measured). The only fix is not having the credentialed alias.
#
# So: pass a per-user token at invocation time. parity-test.sh does this, and
# `crates/sqe-coordinator/tests/it/common/spark_runner.rs` does the same for the
# test suite:
#
#   TOKEN=$(curl -s -d grant_type=password -d client_id=sqe-client \
#     -d client_secret=sqe-secret-change-me -d username=bob -d password=bob123 \
#     http://keycloak:8080/realms/iceberg-ranger/protocol/openid-connect/token \
#     | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
#   spark-sql --conf spark.sql.catalog.sales_wh.token="$TOKEN" \
#             --conf spark.sql.catalog.sales_wh.token-refresh-enabled=false -e "..."
#
# `token-refresh-enabled=false` is load-bearing. With refresh ON, Iceberg exchanges
# the external Keycloak JWT at Polaris's own token endpoint and the identity
# silently reverts to a service account, so every denial test passes for the wrong
# reason.
#
# A spark-sql run with no token now FAILS to load the table rather than quietly
# succeeding as root. That is the intended behaviour: fail closed.
#
# Nothing in this quickstart needs root through Spark. The demo data is seeded by
# the `data-seed` service through SQE as carol (see docker-compose.yml), and Spark
# only ever reads.
#
# S3 (RustFS): direct static credentials (no vended-credentials delegation).

# ── Iceberg + Kyuubi Authz extensions ────────────────────────────────────────
spark.sql.extensions                                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.apache.kyuubi.plugin.spark.authz.ranger.RangerSparkExtension

# ── Iceberg REST catalog (Polaris, caller's own identity) ─────────────────────
spark.sql.catalog.sales_wh                             org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.sales_wh.catalog-impl                org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.sales_wh.uri                         http://polaris:8181/api/catalog
spark.sql.catalog.sales_wh.warehouse                   sales_wh
# No `credential` and no `oauth2-server-uri`: see the header. The caller passes
# `--conf spark.sql.catalog.sales_wh.token=<their OIDC access token>`.
#
# Refresh is pinned OFF here so a caller who supplies a token cannot accidentally
# have it exchanged for a service-account token by leaving the default on.
spark.sql.catalog.sales_wh.token-refresh-enabled        false
# Polaris realm header (required for multi-realm Polaris)
spark.sql.catalog.sales_wh.header.Polaris-Realm        iceberg-ranger
# S3 direct access (static creds; no vended-credentials needed)
spark.sql.catalog.sales_wh.s3.endpoint                 http://rustfs:9000
spark.sql.catalog.sales_wh.s3.path-style-access        true
spark.sql.catalog.sales_wh.s3.access-key-id            s3admin
spark.sql.catalog.sales_wh.s3.secret-access-key        s3adminpw
spark.sql.catalog.sales_wh.io-impl                     org.apache.iceberg.aws.s3.S3FileIO

# ── Hadoop S3A (for low-level file access) ────────────────────────────────────
spark.hadoop.fs.s3a.endpoint                           http://rustfs:9000
spark.hadoop.fs.s3a.path.style.access                 true
spark.hadoop.fs.s3a.access.key                        s3admin
spark.hadoop.fs.s3a.secret.key                        s3adminpw
spark.hadoop.fs.s3a.impl                              org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled            false
spark.hadoop.fs.s3a.aws.credentials.provider          org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ── Ranger plugin config location ────────────────────────────────────────────
# Kyuubi Authz discovers ranger-spark-security.xml from SPARK_HOME/conf/.
# The spark.sql.extensions above loads RangerSparkExtension which reads that file.
spark.kyuubi.authz.ranger.conf.dir                     /opt/spark/conf

# ── Logging / misc ────────────────────────────────────────────────────────────
# NO spark.sql.defaultCatalog.
#
# Setting it to `sales_wh` made Spark initialize that catalog eagerly at session
# start, so with no credential configured even `SELECT 1` failed:
#
#   ErrorHandlers: Unable to parse error response
#   java.io.UncheckedIOException: ... No content to map due to end-of-input
#
# A session that has not been given an identity should not fail on arrival; it
# should fail when it touches a table. Every caller here names the catalog
# explicitly (`sales_wh.sales.orders`, or the per-user alias the test suite
# registers), so a default is not needed.
spark.driver.extraJavaOptions                          -Dlog4j2.formatMsgNoLookups=true
