# Plain `docker compose up` works here. The whole Polaris + Ranger + Keycloak
# stack is included; docker-compose.override.yml (auto-loaded) swaps SQE's
# config for the Okta + MCP one and adds the env-driven source settings.
include:
  - path: ../polaris-ranger-keycloak/docker-compose.yml
    env_file: .env
