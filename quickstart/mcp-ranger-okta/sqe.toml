# SQE for the MCP + Ranger + Okta quickstart: Okta is the only identity
# provider, Ranger the policy store, and the data is external (AWS Glue Data
# Catalog + S3 through the AWS credential chain).
#
# Placeholders below are overridden by docker-compose.yml, later by the Fargate
# task definition, with SQE_<SECTION>__<FIELD> variables. Array entries
# ([[auth.providers]], authorization_servers) can only be overridden by index,
# so the slots must exist here.

[coordinator]
flight_sql_port = 50051
trino_http_port = 8080
mode = "hybrid"
flight_compression = "none"

[worker]
memory_limit = "4GB"
spill_dir = "/tmp/sqe-spill"

# ── MCP ─────────────────────────────────────────────────────────────────────
[mcp]
enabled = true
port = 0 # shares metrics.prometheus_port + 1 (9091 in the container)
resource_uri = "http://localhost:19092/mcp"                                # SQE_MCP__RESOURCE_URI
authorization_servers = ["https://CHANGE-ME.okta.com/oauth2/CHANGE-ME"]  # SQE_MCP__AUTHORIZATION_SERVERS__0
allowed_origins = []
read_scope = "sqe:mcp:read"
write_scope = "sqe:mcp:write"
allow_writes = false # SQE_MCP__ALLOW_WRITES
write_roles = ["datalake_admin"] # an Okta group; only matters once allow_writes is on
max_result_rows = 200
max_response_bytes = 262144

# ── Authentication: Okta access tokens, nothing else ────────────────────────
# The legacy [auth] fields are required by the validator but unused: the
# provider chain below is the whole story.
[auth]
client_id = "unused-no-idp"
token_endpoint = "http://127.0.0.1:1/token"

# Okta group names are the roles Ranger policies target.
[[auth.providers]]
type = "bearer_token"
jwks_url = "https://CHANGE-ME.okta.com/oauth2/CHANGE-ME/v1/keys" # SQE_AUTH__PROVIDERS__0__JWKS_URL
issuer = "https://CHANGE-ME.okta.com/oauth2/CHANGE-ME"           # SQE_AUTH__PROVIDERS__0__ISSUER
audience = "http://localhost:19092/mcp"                           # SQE_AUTH__PROVIDERS__0__AUDIENCE
user_claim = "sub"  # the Okta login (email) on custom-server access tokens
roles_claim = "groups"
groups_claim = "groups"

# ── Sources: no Iceberg catalog. The Glue root, the bucket policy and the
#    MCP-only listener come from the flags in docker-compose.yml
#    (--glue-catalog, --glue-database, --allow-all-buckets, --mcp-only); the
#    TOML equivalents are `[[hive.roots]] kind = "glue"`, `[storage.tvf]
#    allow_all_object_stores = true`, and the three SQL ports set to 0.
#    `SHOW SCHEMAS` / `SHOW TABLES FROM <root>.<database>` list the catalog.
#    The [catalog] table is required by the parser but deliberately empty: an
#    empty catalog_url means no Iceberg REST catalog at all. A placeholder URL
#    would be registered as the default catalog and every SQL statement would
#    fail building its session on it (list namespaces against the placeholder)
#    before ever reaching Glue.
[catalog]

[storage]
s3_region = "eu-central-1" # SQE_STORAGE__S3_REGION; no keys: AWS SDK credential chain

[hive]
manifest_max_partition_index_entries = 100000

# ── Ranger: SQE decides Hive-root table access itself from policyType 0
#    grants (hive_access_policies, default on), matched against the JWT
#    user, roles and groups; row filters and masks come from the same service.
[policy]
engine = "ranger"

[policy.ranger]
url = "http://ranger-admin:6080" # SQE_POLICY__RANGER__URL
service-name = "query"
admin-user = "admin"
admin-password = "rangerR0cks!" # SQE_POLICY__RANGER__ADMIN_PASSWORD

[rate_limit]
enabled = true
# The MCP `search_tables` tool runs one SHOW TABLES per Glue database and each
# one counts here; a catalog with 135 databases blew through 120 and silently
# skipped the rest. Size this above the database count.
per_user_queries_per_minute = 1000
global_queries_per_minute = 5000

[session]
idle_timeout_secs = 900

[metrics]
prometheus_port = 9090
