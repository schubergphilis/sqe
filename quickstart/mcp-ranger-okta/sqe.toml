# SQE config for the MCP + Ranger + Okta quickstart. Sits on top of the
# polaris-ranger-keycloak stack. URLs, secrets and Okta values are placeholders
# that docker-compose.yml (later: the Fargate task definition) overrides with
# SQE_<SECTION>__<FIELD> environment variables. Array entries ([[auth.providers]],
# authorization_servers) must exist here so an indexed override has a slot.

[coordinator]
flight_sql_port = 50051
trino_http_port = 8080
mode = "hybrid"
flight_compression = "none"

[worker]
memory_limit = "4GB"
spill_dir = "/tmp/sqe-spill"

# ── MCP ─────────────────────────────────────────────────────────────────────
[mcp]
enabled = true
port = 0 # shares metrics.prometheus_port + 1 (9091 in the container)
resource_uri = "http://localhost:19092/mcp" # SQE_MCP__RESOURCE_URI
authorization_servers = ["https://CHANGE-ME.okta.com/oauth2/CHANGE-ME"] # SQE_MCP__AUTHORIZATION_SERVERS__0
allowed_origins = []
read_scope = "sqe:mcp:read"
write_scope = "sqe:mcp:write"
allow_writes = false # SQE_MCP__ALLOW_WRITES
write_roles = ["engineer", "sqe_admin"]
max_result_rows = 100
max_response_bytes = 262144

# ── Authentication ──────────────────────────────────────────────────────────
[auth]
keycloak_url = "http://keycloak:8080"
realm = "iceberg-ranger"
client_id = "sqe-client"
client_secret = "sqe-secret-change-me" # SQE_AUTH__CLIENT_SECRET
ssl_verification = false
admin_roles = ["sqe_admin"]

# Provider 0: Keycloak ROPC. Only the stack's seed job (carol over Trino HTTP
# basic auth) and test.sh use it. Drop it once Okta users own the data.
[[auth.providers]]
type = "oidc_password"
token_url = "http://keycloak:8080/realms/iceberg-ranger/protocol/openid-connect/token"
client_id = "sqe-client"
client_secret = "sqe-secret-change-me"
roles_claim = "realm_access.roles"
accept_invalid_certs = true

# Provider 1: Okta access tokens presented by MCP clients. Okta group names are
# the SQE roles Ranger policies target (analyst, engineer, sqe_admin).
[[auth.providers]]
type = "bearer_token"
jwks_url = "https://CHANGE-ME.okta.com/oauth2/CHANGE-ME/v1/keys" # SQE_AUTH__PROVIDERS__1__JWKS_URL
issuer = "https://CHANGE-ME.okta.com/oauth2/CHANGE-ME"           # SQE_AUTH__PROVIDERS__1__ISSUER
audience = "http://localhost:19092/mcp"                           # SQE_AUTH__PROVIDERS__1__AUDIENCE
user_claim = "sub"     # Okta puts the login (email) in `sub` on custom-server access tokens
roles_claim = "groups"
groups_claim = "groups"

# ── Source databases (Polaris catalogs) ─────────────────────────────────────
# One block per source; SQE_CATALOGS__<NAME>__POLARIS_URL / __WAREHOUSE override.
[catalogs.sales_wh]
polaris_url = "http://polaris:8181/api/catalog"
warehouse = "sales_wh"
metadata_cache_ttl_secs = 30
default_table_format_version = 2

[catalogs.ops_wh]
polaris_url = "http://polaris:8181/api/catalog"
warehouse = "ops_wh"
metadata_cache_ttl_secs = 30
default_table_format_version = 2

[catalog]
polaris_url = "http://polaris:8181/api/catalog"
warehouse = "sales_wh"

[query]
catalog_discovery = "polaris-auto"

# ── Storage (SQE_STORAGE__S3_*) ─────────────────────────────────────────────
[storage]
s3_endpoint = "http://rustfs:9000"
s3_region = "us-east-1"
s3_access_key = "s3admin"
s3_secret_key = "s3adminpw"
s3_path_style = true
s3_allow_http = true

# ── Ranger: fine-grained enforcement + GRANT/REVOKE ─────────────────────────
# Same two-service layout as ../polaris-ranger-keycloak/sqe.toml (see its comments).
[policy]
engine = "ranger"
mask-precedence = "tag"

[policy.ranger]
url = "http://ranger-admin:6080" # SQE_POLICY__RANGER__URL
service-name = "query"
project-tags = true
admin-user = "admin"
admin-password = "rangerR0cks!" # SQE_POLICY__RANGER__ADMIN_PASSWORD

[access_control]
backend = "ranger"
url = "http://ranger-admin:6080" # SQE_ACCESS_CONTROL__URL

[access_control.ranger]
service-name = "polaris"
admin-user = "admin"
admin-password = "rangerR0cks!" # SQE_ACCESS_CONTROL__RANGER__ADMIN_PASSWORD
realm = "*"

[rate_limit]
enabled = true
per_user_queries_per_minute = 120
global_queries_per_minute = 5000

[session]
idle_timeout_secs = 900

[metrics]
prometheus_port = 9090
