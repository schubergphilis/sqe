# Reuses the Polaris + Keycloak user-token quickstart, adding MCP on SQE's
# existing web listener. All bearer tokens remain per-user end to end.

[coordinator]
flight_sql_port = 50051
trino_http_port = 8080
mode = "hybrid"
flight_compression = "none"

[mcp]
enabled = true
port = 0 # share metrics.prometheus_port + 1 (9091 inside the container)
resource_uri = "http://localhost:19091/mcp"
authorization_servers = ["http://keycloak:8080/realms/iceberg"]
allowed_origins = []
read_scope = "sqe:mcp:read"
write_scope = "sqe:mcp:write"
allow_writes = false # run.sh --writes overrides this through the environment
write_roles = ["data_writer"]
max_result_rows = 100
max_response_bytes = 262144

[worker]
memory_limit = "4GB"
spill_dir = "/tmp/sqe-spill"

[auth]
keycloak_url = "http://keycloak:8080"
realm = "iceberg"
client_id = "sqe-client"
client_secret = ""
# DEV ONLY: skips TLS certificate checks towards Keycloak. The stack is plain
# HTTP on a Docker network; a real deployment keeps this true.
ssl_verification = false

[[auth.providers]]
type = "bearer_token"
jwks_url = "http://keycloak:8080/realms/iceberg/protocol/openid-connect/certs"
issuer = "http://keycloak:8080/realms/iceberg"
user_claim = "preferred_username"
roles_claim = "realm_access.roles"
# DEV ONLY: accepts tokens without an `aud` equal to the MCP resource_uri. A
# token minted for any client then works here; production pins the audience.
allow_unbounded_audience = true
# DEV ONLY: fetches signing keys over plain HTTP from the Docker-only Keycloak
# hostname. Production requires an https JWKS URL.
allow_insecure_jwks = true

[catalogs.quickstart]
polaris_url = "http://polaris:8181/api/catalog"
warehouse = "quickstart"
metadata_cache_ttl_secs = 30
default_table_format_version = 3

[catalog]
polaris_url = "http://polaris:8181/api/catalog"
warehouse = "quickstart"

[storage]
s3_endpoint = "http://rustfs:9000"
s3_region = "us-east-1"
# The RustFS keys come from the environment, not this file: docker-compose.yml
# sets SQE_STORAGE__S3_ACCESS_KEY and SQE_STORAGE__S3_SECRET_KEY from .env.
s3_path_style = true
# DEV ONLY: plain HTTP to the object store inside the Docker network.
s3_allow_http = true

[policy]
engine = "passthrough"

[rate_limit]
enabled = true
per_user_queries_per_minute = 120
global_queries_per_minute = 5000

[session]
idle_timeout_secs = 900

[metrics]
prometheus_port = 9090
