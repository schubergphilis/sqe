<text x="40" y="916" font-size="13" fill="#898781">S3 run 2026-11-06. On 2 and 4 November, SQE, DuckDB and Polars all read q1 at 207 to 231 MB/s.</text>
<text x="40" y="936" font-size="13" fill="#898781">sqe-polaris reads the ZSTD Iceberg copy; the others read the Snappy Parquet files, which is why it reads fewer bytes.</text>
